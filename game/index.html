<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="theme-color" content="#003C70">
<title>웨일리 몬스터 잡기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@500;700;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{
  --navy:#003C70; --deep:#012A4F; --cyan:#0FC3F4; --yellow:#FFEE62; --flame:#FF5826; --ink:#16324F;
  --pink:#FF5C8A; --green:#2BD47D; --paper:#F4FBFF;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; height:100%; background:var(--deep); color:#fff; font-family:'Pretendard','Noto Sans KR',system-ui,sans-serif; overscroll-behavior:none; -webkit-user-select:none; user-select:none}
button{font:inherit; color:inherit; border:0; background:none; cursor:pointer; padding:0}
.hidden{display:none !important}
.jua{font-family:'Jua','Noto Sans KR',sans-serif}
.screen{position:fixed; inset:0; display:flex; flex-direction:column; overflow:hidden}

/* ───── 홈 ───── */
#home{background:linear-gradient(180deg,rgba(4,52,104,.55) 0%,rgba(2,38,80,.78) 45%,rgba(1,24,52,.95) 100%),url(../arcade/img/bgSea.jpg) center/cover fixed; overflow-y:auto}
.home-in{max-width:720px; width:100%; margin:0 auto; padding:22px 16px 40px; display:flex; flex-direction:column; gap:16px}
.title{display:flex; align-items:center; gap:12px}
.title h1{margin:0; font-family:'Jua'; font-weight:400; font-size:clamp(28px,6vw,40px); line-height:1.1}
.title small{display:block; font-size:13px; color:#9FD8F5; margin-top:4px}
.panel{background:rgba(255,255,255,.10); border:1px solid rgba(255,255,255,.22); border-radius:22px; padding:14px; backdrop-filter:blur(14px); -webkit-backdrop-filter:blur(14px); box-shadow:0 10px 30px rgba(0,20,50,.18)}
.panel h2{margin:0 0 10px; font-size:13px; color:#BFE6FA; font-weight:700; letter-spacing:.02em}
.chips{display:flex; gap:8px; flex-wrap:wrap}
.chip{padding:10px 16px; border-radius:999px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18); font-weight:800; font-size:16px}
.chip.on{background:var(--yellow); color:var(--navy)}
.sel{display:flex; gap:8px; flex-wrap:wrap}
.sel select{font:inherit; font-weight:700; font-size:16px; padding:10px 12px; border-radius:14px; border:0; background:#fff; color:var(--navy)}
.course{display:flex; align-items:center; gap:8px; flex-wrap:wrap; font-family:'Jua'; font-size:20px}
.course .g{background:rgba(255,255,255,.94); color:var(--navy); border-radius:16px; padding:6px 12px 6px 6px; display:flex; align-items:center; gap:6px; box-shadow:0 6px 16px rgba(0,20,50,.2)}
.gico{width:34px; height:34px; object-fit:contain; display:inline-block; vertical-align:middle}
.course .arr{color:var(--yellow)}
.preview{display:flex; gap:6px; flex-wrap:wrap; justify-content:center}
.preview .m{width:64px; height:64px}
.big{
  font-family:'Jua'; font-size:26px; padding:16px; border-radius:22px; background:var(--yellow); color:var(--navy);
  box-shadow:0 10px 24px rgba(255,214,60,.35), inset 0 -4px 0 rgba(0,0,0,.12); transition:transform .1s; width:100%;
  background:linear-gradient(180deg,#FFF27A,#FFD43B);
}
.big:active{transform:scale(.98)}
.ghost{font-weight:800; font-size:16px; padding:13px; border-radius:18px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.2); backdrop-filter:blur(10px); width:100%}
.row2{display:flex; gap:10px}
.who{background:rgba(255,238,98,.12); border:2px solid rgba(255,238,98,.35); border-radius:18px; padding:10px 14px; font-size:15px}
.who b{color:var(--yellow)}
.who span{display:block; font-size:12px; color:#CFEAF8; margin-top:2px}
.opt{display:flex; align-items:center; gap:8px; font-size:14px; color:#CFEAF8}
.opt input{width:20px; height:20px}

/* ───── 게임 공통 ───── */
#play{background:#0b4f8a url(../arcade/img/bgSea.jpg) center/cover}
.hud{display:flex; align-items:center; gap:10px; padding:10px 12px; padding-top:max(10px, env(safe-area-inset-top)); background:rgba(0,30,70,.35); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); z-index:5}
.hud .x{width:42px; height:42px; border-radius:50%; background:rgba(255,255,255,.15); font-size:20px; font-weight:900}
.hud .mid{flex:1; min-width:0}
.hud .lbl{font-family:'Jua'; font-size:20px; line-height:1.1}
.hud .sub{font-size:12px; color:#9FD8F5}
.dots{display:flex; gap:4px; margin-top:5px}
.dots i{flex:1; height:7px; border-radius:4px; background:rgba(255,255,255,.18)}
.dots i.done{background:var(--green)} .dots i.cur{background:var(--yellow)}
.coin{font-family:'Jua'; font-size:22px; background:rgba(255,255,255,.12); padding:6px 12px; border-radius:999px; display:flex; align-items:center; gap:6px}
.coin.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.3)}}
.ask{display:flex; align-items:center; justify-content:center; gap:12px; padding:8px 12px; z-index:4}
.say{
  display:flex; align-items:center; gap:10px; background:#fff; color:var(--navy); border-radius:999px; padding:8px 18px 8px 8px;
  font-family:'Jua'; font-size:22px; box-shadow:0 5px 0 rgba(0,0,0,.25);
}
.say .spk{width:46px; height:46px; border-radius:50%; background:var(--cyan); display:grid; place-items:center; animation:ring 1.6s infinite}
.say .spk svg{width:26px; height:26px; fill:#fff}
@keyframes ring{0%{box-shadow:0 0 0 0 rgba(15,195,244,.6)} 70%{box-shadow:0 0 0 14px rgba(15,195,244,0)}}
.stage{position:relative; flex:1; overflow:hidden; touch-action:none}
.bar{display:flex; gap:6px; padding:8px 10px; padding-bottom:max(8px, env(safe-area-inset-bottom)); background:rgba(0,30,70,.4); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px); overflow-x:auto; z-index:5}
.bar .slot{flex:none; width:70px; display:flex; flex-direction:column; align-items:center; gap:3px}
.bar .slot .m{width:56px; height:56px; transition:filter .3s}
.bar .slot:not(.caught) .m{filter:grayscale(1) brightness(.55)}
.bar .slot.hit .m{animation:hop .5s}
.bar .slot.cur .m{filter:none; animation:bob 1s infinite}
.pips{display:flex; gap:3px}
.pips i{width:12px; height:6px; border-radius:3px; background:rgba(255,255,255,.2)}
.pips i.on{background:var(--yellow)}
.bar .slot.caught .pips i{background:var(--green)}
@keyframes hop{40%{transform:translateY(-12px) scale(1.1)}}
@keyframes bob{50%{transform:translateY(-4px)}}

.pic{width:100%; height:100%; object-fit:contain; display:block; pointer-events:none}
.txt{font-family:'Jua'; color:var(--navy); text-align:center; line-height:1.1; padding:4px; word-break:break-word}
.lab{position:absolute; left:50%; bottom:-6px; transform:translateX(-50%); background:var(--navy); color:#fff; font-family:'Jua'; font-size:14px; padding:2px 8px; border-radius:8px; white-space:nowrap; pointer-events:none}
.glow{animation:glow 1s infinite !important}
@keyframes glow{50%{filter:drop-shadow(0 0 14px var(--yellow)) drop-shadow(0 0 4px var(--yellow))}}

/* ── 버블팡 ── */
.g-bubble{background:url(../arcade/img/bgSea.jpg) center/cover}
/* ── 바다 계단 ── */
.g-stairs{background:url(../arcade/img/bgSky.jpg) center/cover}
.stw{position:absolute; left:0; top:0; width:100%; height:100%; will-change:transform}
.step{position:absolute; height:20px; border-radius:12px; background:linear-gradient(#fff,#cfe9ff); box-shadow:0 6px 0 #8fc1ec, 0 12px 18px rgba(0,40,90,.18)}
.step.on{background:linear-gradient(#fff6c8,#ffd35a); box-shadow:0 6px 0 #e3a92a, 0 12px 18px rgba(120,80,0,.2)}
.stc{position:absolute; z-index:3; filter:drop-shadow(0 8px 8px rgba(0,30,70,.25)); pointer-events:none}
.stc.hop{animation:sthop .42s ease-out}
@keyframes sthop{40%{translate:0 -38px}}
.stc.oops{animation:stoops .45s}
@keyframes stoops{25%{rotate:-12deg}75%{rotate:12deg}}
.stfl{position:absolute; left:50%; top:10px; transform:translateX(-50%); z-index:4; background:rgba(255,255,255,.8); color:var(--navy); font-family:'Jua'; font-size:20px; padding:4px 16px; border-radius:999px; box-shadow:0 6px 14px rgba(0,30,70,.15)}
.stbtns{position:absolute; left:12px; right:12px; bottom:12px; display:flex; gap:12px; z-index:5}
.stb{flex:1; height:min(34vw,30vh,190px); border-radius:26px; background:rgba(255,255,255,.92); border:2px solid #fff; padding:10px; display:grid; place-items:center; position:relative; box-shadow:0 12px 26px rgba(0,30,70,.22); transition:transform .12s}
.stb:active{transform:scale(.96)}
.stb .arr{position:absolute; top:6px; font-size:15px; color:#7fa3c8; font-family:'Jua'}
.stb.l .arr{left:12px} .stb.r .arr{right:12px}
.stb.shake{animation:shake .35s}
.stb.glow{box-shadow:0 0 0 5px var(--yellow), 0 12px 26px rgba(0,30,70,.22)}
/* ── 게임 고르기 ── */
.gpick{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.gp{display:flex; align-items:center; gap:8px; padding:10px; border-radius:18px; background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.22); text-align:left; color:#fff; font-weight:800; font-size:15px; line-height:1.2}
.gp img{width:46px; height:46px; object-fit:contain; flex:none; filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.gp small{display:block; font-weight:500; font-size:11.5px; opacity:.8; margin-top:2px}
.gp.on{background:rgba(255,255,255,.95); color:var(--navy); box-shadow:0 0 0 3px var(--yellow), 0 10px 22px rgba(0,20,50,.25)}
.gp.wide{grid-column:1 / -1}
.gp.wide .imgs{display:flex; flex:none} .gp.wide .imgs img{width:38px; height:38px; margin-right:-6px}
.bub{position:absolute; width:var(--bs); height:var(--bs); border-radius:50%; will-change:transform;
  background:radial-gradient(circle at 32% 28%, rgba(255,255,255,.95) 0 8%, rgba(255,255,255,.35) 9% 18%, rgba(255,255,255,.12) 40%, rgba(160,230,255,.35) 75%, rgba(255,255,255,.7) 100%);
  border:3px solid rgba(255,255,255,.75); box-shadow:inset 0 0 18px rgba(255,255,255,.5), 0 6px 18px rgba(0,40,80,.25)}
.bub .inner{position:absolute; inset:16%; border-radius:50%; overflow:hidden; background:rgba(255,255,255,.85); display:grid; place-items:center}
.bub.shake{animation:shake .4s}
.bub.pop{animation:pop .35s forwards}
@keyframes pop{to{transform:var(--t) scale(1.5); opacity:0}}
@keyframes shake{25%{margin-left:-10px} 75%{margin-left:10px}}
.spark{position:absolute; width:12px; height:12px; border-radius:50%; pointer-events:none; animation:spark .6s ease-out forwards}
@keyframes spark{to{transform:translate(var(--dx),var(--dy)) scale(.2); opacity:0}}

/* ── 두더지 ── */
.g-mole{background:linear-gradient(180deg,rgba(255,255,255,0) 0%,rgba(255,236,196,.55) 100%),url(../arcade/img/bgSea.jpg) center bottom/cover}
.holes{position:absolute; inset:4% 3% 3%; display:grid; grid-template-columns:repeat(3,1fr); grid-template-rows:repeat(2,1fr); gap:3%}
.hole{position:relative; overflow:hidden; border-radius:0 0 50% 50% / 0 0 30% 30%}
.hole::after{content:''; position:absolute; left:6%; right:6%; bottom:4%; height:22%; border-radius:50%; background:#C99A5B; box-shadow:inset 0 8px 0 #9E733D; z-index:1}
.mole{position:absolute; left:50%; bottom:8%; width:74%; transform:translate(-50%,105%); transition:transform .22s cubic-bezier(.3,1.4,.5,1); z-index:2}
.hole::before{content:''; position:absolute; left:2%; right:2%; bottom:0; height:16%; background:#F3D9A4; border-radius:50% 50% 0 0; z-index:3}
.mole.up{transform:translate(-50%,0)}
.mole .sign{background:#fff; border-radius:14px; border:3px solid #fff; box-shadow:0 6px 14px rgba(0,30,60,.25); aspect-ratio:1; width:78%; margin:0 auto -8%; position:relative; z-index:2; display:grid; place-items:center; overflow:hidden}
.mole .mbody{display:block; width:100%; height:auto; filter:drop-shadow(0 6px 8px rgba(0,0,0,.18))}
.mole.bonk .mbody{animation:squash .4s}
.mole.miss .mbody{animation:tease .5s}
@keyframes squash{40%{transform:scale(1.2,.7)}}
@keyframes tease{25%{transform:rotate(-12deg)} 75%{transform:rotate(12deg)}}
.stars{position:absolute; left:50%; top:30%; font-size:28px; transform:translate(-50%,-50%); animation:stars .7s forwards; z-index:4; pointer-events:none}
@keyframes stars{to{transform:translate(-50%,-140%) scale(1.4); opacity:0}}

/* ── 낚시 ── */
.g-fish{background:linear-gradient(180deg,#d8f3ff 0 14%, transparent 14%),url(../arcade/img/bgSea.jpg) center/cover}
.wave{position:absolute; left:0; right:0; top:12%; height:16px; background:radial-gradient(circle at 10px -4px, transparent 12px, #a9e2fb 13px) repeat-x; background-size:20px 16px}
.boat{position:absolute; z-index:3; height:auto; filter:drop-shadow(0 8px 10px rgba(0,40,80,.25)); animation:rock 3s ease-in-out infinite; transform-origin:50% 90%}
@keyframes rock{50%{transform:rotate(-2.5deg) translateY(2px)}}
.line{position:absolute; width:2px; background:rgba(255,255,255,.9); top:9%; z-index:2; transform-origin:top}
.hook{position:absolute; width:26px; height:26px; margin-left:-11px; z-index:3; transition:top .35s ease-in, left .25s}
.fish{position:absolute; width:var(--fs); will-change:transform}
.fish .fb{display:block; width:100%; height:auto; transform:scaleX(var(--b,1)); filter:drop-shadow(0 6px 8px rgba(0,30,70,.25))}
.fish .tag{position:absolute; left:50%; top:-46%; width:60%; transform:translateX(-50%); aspect-ratio:1; border-radius:22px; background:#fff; border:3px solid #fff; overflow:hidden; display:grid; place-items:center; box-shadow:0 6px 14px rgba(0,30,70,.25)}
.fish .badge{position:absolute; left:28%; top:6%; width:44%; aspect-ratio:1; border-radius:50%; background:#fff; border:3px solid rgba(255,255,255,.9); overflow:hidden; display:grid; place-items:center; box-shadow:0 2px 6px rgba(0,0,0,.2)}
.fish.flip .fb{transform:scaleX(calc(var(--b,1) * -1))}
.bubbles-bg i{position:absolute; bottom:-20px; width:10px; height:10px; border-radius:50%; border:2px solid rgba(255,255,255,.5); animation:rise linear infinite}
@keyframes rise{to{transform:translateY(-110vh)}}
.splash{position:absolute; font-size:40px; transform:translate(-50%,-50%); animation:stars .8s forwards; z-index:5; pointer-events:none}

/* ── 몬스터 이미지 ── */
.m.mi{display:block; position:relative}
.m.mi img{width:100%; height:100%; object-fit:contain; display:block; filter:var(--f,none) drop-shadow(0 4px 6px rgba(0,30,70,.2))}
.m.mi.sh img{filter:var(--f,none) drop-shadow(0 0 6px #FFE45C) drop-shadow(0 0 12px rgba(255,214,60,.8))}
.m.mi .spk{position:absolute; inset:0; pointer-events:none}
/* ───── 잡기 연출 ───── */
#catch{position:fixed; inset:0; z-index:30; background:radial-gradient(circle at 50% 42%, rgba(30,170,230,.97) 0%, rgba(3,60,112,.98) 45%, rgba(0,20,45,.99) 80%); display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; padding:20px}
.cstage{position:relative; width:240px; height:240px}
.cstage .m{position:absolute; inset:0; width:100%; height:100%}
.cstage .mm > div > .m{position:static; display:block}
.ball{position:absolute; left:50%; top:50%; width:84px; height:84px; margin:-42px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff 0 10%, #8BE8FF 22%, #0FC3F4 55%, #0573A8 100%); border:4px solid #fff;
  box-shadow:0 0 0 4px var(--navy), 0 10px 30px rgba(0,0,0,.4)}
.ball::after{content:''; position:absolute; left:-4px; right:-4px; top:calc(50% - 4px); height:8px; background:var(--navy)}
.ball b{position:absolute; left:50%; top:50%; width:24px; height:24px; margin:-12px; border-radius:50%; background:#fff; border:4px solid var(--navy); z-index:1}
.c1 .ball{animation:throw .6s cubic-bezier(.3,.1,.3,1) forwards}
@keyframes throw{0%{transform:translate(0,320px) scale(.6) rotate(0)} 100%{transform:translate(0,0) scale(1) rotate(720deg)}}
.c2 .m{animation:suck .4s forwards}
@keyframes suck{to{transform:scale(0); opacity:0}}
.c3 .ball{animation:wob 1.5s ease-in-out}
@keyframes wob{0%,100%{transform:rotate(0)} 10%{transform:rotate(-22deg)} 20%{transform:rotate(0)} 40%{transform:rotate(22deg)} 50%{transform:rotate(0)} 70%{transform:rotate(-22deg)} 80%{transform:rotate(0)}}
.c4 .ball{animation:flash .5s}
@keyframes flash{50%{filter:brightness(1.8); transform:scale(1.15)}}
.c4 .m{animation:appear .5s .1s backwards}
@keyframes appear{from{transform:scale(0) rotate(-30deg)}}
.ctitle{font-family:'Jua'; font-size:42px; color:var(--yellow); text-shadow:0 4px 0 rgba(0,0,0,.3); animation:appear .5s}
.cname{font-family:'Jua'; font-size:28px}
.cword{display:flex; align-items:center; gap:12px; background:#fff; color:var(--navy); border-radius:20px; padding:8px 18px 8px 8px; font-family:'Jua'; font-size:26px}
.cgrid{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:720px}
.cgrid .cword{font-size:22px}
.cword img{width:64px; height:64px; object-fit:contain; border-radius:12px; background:#F4FBFF}
.cword small{display:block; font-size:16px; color:#5B7A95; font-family:'Noto Sans KR'; font-weight:700}
.shiny-tag{font-family:'Jua'; font-size:20px; color:#FFD54A; animation:glow 1s infinite}
.confetti{position:fixed; inset:0; pointer-events:none; z-index:31; overflow:hidden}
.confetti i{position:absolute; top:-20px; width:10px; height:16px; border-radius:3px; animation:fall linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}

/* 라운드 안내 */
#intro{position:fixed; inset:0; z-index:25; display:grid; place-items:center; background:rgba(0,20,45,.85)}
#intro .card{background:rgba(255,255,255,.96); color:var(--navy); border-radius:30px; padding:22px 30px 26px; text-align:center; animation:appear .4s; min-width:280px; box-shadow:0 20px 50px rgba(0,20,50,.35)}
#intro .gi img{width:120px; height:120px; object-fit:contain}
#intro .gi{font-size:72px; line-height:1}
#intro h3{font-family:'Jua'; font-weight:400; font-size:34px; margin:8px 0 4px}
#intro p{margin:0; color:#5B7A95; font-weight:700}
#intro .r{font-family:'Jua'; color:var(--flame); font-size:18px}

/* ───── 결과 · 도감 ───── */
#result,#dex{background:linear-gradient(180deg,rgba(4,52,104,.6),rgba(1,24,52,.95)),url(../arcade/img/bgSea.jpg) center/cover fixed; overflow-y:auto}
.grid{display:grid; grid-template-columns:repeat(auto-fill,minmax(104px,1fr)); gap:10px}
.mon{background:rgba(255,255,255,.12); border:1px solid rgba(255,255,255,.18); border-radius:20px; padding:8px 6px 10px; text-align:center; position:relative; backdrop-filter:blur(10px)}
.mon .m{width:84px; height:84px; display:block; margin:0 auto}
.mon b{display:block; font-family:'Jua'; font-weight:400; font-size:16px}
.mon small{display:block; font-size:12px; color:#9FD8F5}
.mon.lock .m{filter:brightness(0) opacity(.35)}
.mon .sh{position:absolute; top:6px; right:8px; color:#FFD54A}
.stat{display:flex; gap:10px}
.stat div{flex:1; background:rgba(255,255,255,.1); border-radius:18px; padding:12px; text-align:center}
.stat b{display:block; font-family:'Jua'; font-size:30px; font-weight:400; color:var(--yellow)}
.stat span{font-size:12px; color:#9FD8F5}
.tabs{display:flex; gap:6px}
@media (prefers-reduced-motion: reduce){*{animation-duration:.01s !important}}
.rk{width:100%;margin-top:14px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #fff;border-radius:22px;padding:12px 14px;box-shadow:0 12px 30px rgba(20,70,130,.15);color:#0b3a73;text-align:left;font-family:'Pretendard',system-ui,sans-serif}
.rk-load{font-size:14px;font-weight:700;text-align:center;color:#5a7aa3;padding:6px}
.rk-team{font-size:13.5px;font-weight:700;background:linear-gradient(135deg,#e6f6ff,#fff3d6);border-radius:14px;padding:9px 12px;margin-bottom:10px;line-height:1.4}
.rk-team b{white-space:nowrap;font-size:17px;font-weight:900;color:#ff7a2f}
.rk-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.rk-h>span{font-size:16px;font-weight:900}
.rk-tabs{display:flex;background:rgba(11,58,115,.08);border-radius:999px;padding:3px}
.rk-tabs button{font:inherit;font-size:12.5px;font-weight:800;border:0;background:none;color:#5a7aa3;padding:5px 10px;border-radius:999px;cursor:pointer}

<script>
'use strict';
/* ═════════════ 기본 ═════════════ */
const DATA = window.GAME_DATA;
const $ = (s) => document.querySelector(s);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const store = {
  get(k, d) { try { const v = localStorage.getItem('wmon.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('wmon.' + k, JSON.stringify(v)); } catch (e) {} },
};
const GAMES = {
  bubble: { icon: '🫧', img: 'whale_happy', name: '버블팡', how: '소리를 듣고 맞는 방울을 팡! 터뜨려요' },
  mole: { icon: '🦦', img: 'otter', name: '모래 구멍 콩!', how: '맞는 그림을 든 바다 친구를 콩! 눌러요' },
  fish: { icon: '🎣', img: 'clown_swim', name: '물고기 낚시', how: '맞는 그림을 든 물고기를 눌러서 낚아요' },
  stairs: { icon: '🪜', img: 'turtle_happy', name: '바다 계단', how: '소리를 듣고 맞는 그림 쪽 계단으로 폴짝! 높이 올라가요' },
};
const PICK_DESC = { bubble: '방울 팡팡', mole: '구멍에서 콩!', fish: '낚싯대로 쏙', stairs: '무한 계단처럼 쑥쑥' };
// 교재 Day 1~5 = 월~금. 요일마다 게임 순서가 바뀐다.
const COURSE = {
  1: { day: '월요일', games: ['bubble', 'mole', 'fish'] },
  2: { day: '화요일', games: ['mole', 'fish', 'bubble'] },
  3: { day: '수요일', games: ['fish', 'bubble', 'mole'] },
  4: { day: '목요일', games: ['bubble', 'fish', 'mole'] },
  5: { day: '금요일', games: ['mole', 'bubble', 'fish'], bonus: '금요일은 반짝 몬스터가 더 잘 나와요!' },
};
// 몬스터마다 잡는 데 필요한 정답 수를 1·2·3 으로 섞는다. 그래야 마지막 게임에서만 줄줄이 잡히지 않고
// 게임마다 고르게(약 1/3씩) 잡힌다. 잡은 몬스터는 그 게임이 끝날 때 한 번에 보여 준다.

/* ═════════════ 소리 ═════════════ */
const player = new Audio(); player.preload = 'auto';
let actx = null;
function ac() { actx = WSOUND.ctx(); return actx; }
function tone(f, t, d, type, v, f2) {
  const c = ac(); if (!c) return;
  const o = c.createOscillator(), g = c.createGain(); const s = c.currentTime + t;
  o.type = type || 'sine'; o.frequency.setValueAtTime(f, s); if (f2) o.frequency.exponentialRampToValueAtTime(f2, s + d);
  g.gain.setValueAtTime(.0001, s); g.gain.exponentialRampToValueAtTime(v || .08, s + .01); g.gain.exponentialRampToValueAtTime(.0001, s + d);
  o.connect(g); g.connect(c.destination); o.start(s); o.stop(s + d + .02);
}
const SFX = WSOUND.sfx; // 소리는 ../arcade/sound.js (배경음악 + 효과음)
function say(w) {
  try { speechSynthesis.cancel(); } catch (e) {}
  WSOUND.music.duck(1300);
  if (w.a) {
    player.src = 'audio/' + w.a + '.mp3';
    player.play().catch(() => tts(w.en));
  } else tts(w.en);
}
function tts(t) { try { const u = new SpeechSynthesisUtterance(t); u.lang = 'en-US'; u.rate = .85; speechSynthesis.speak(u); } catch (e) {} }

/* ═════════════ 몬스터 만들기 (단어마다 하나, 늘 같은 모습) ═════════════ */
function hashStr(s) { let h = 2166136261; for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
function rng(seed) { let a = seed; return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function monName(w) {
  const k = (w.ko || '').split(/[,;(/]/)[0].replace(/[^가-힣]/g, '');
  return k && k.length <= 4 ? k + '몬' : w.en.replace(/[^A-Za-z]/g, '').replace(/^./, (c) => c.toUpperCase()) + '몬';
}
const SEA = '../arcade/img/';
// 잡는 몬스터 35종 — 귀여운 17종 + 멋진 18종 (제미나이로 새로 그린 오리지널 캐릭터). 단어마다 늘 같은 몬스터·같은 색으로 나와요.
const MONS = ['fire_pup', 'water_bun', 'leaf_ham', 'ice_cat', 'rock_bear', 'cloud_sheep', 'star_bat', 'candy_dragon', 'thunder_hog', 'flower_kit', 'jelly_pup', 'lava_lizard', 'moon_owl', 'mush_frog', 'crystal_fawn', 'rainbow_snail', 'ghost_mallow',
  // 멋진 몬스터 18종
  'blue_wolf', 'thunder_eagle', 'crystal_dragon', 'lava_rhino', 'sea_serpent', 'ninja_panther', 'ice_fox', 'forest_stag', 'solar_lion',
  'storm_shark', 'mecha_beetle', 'phoenix', 'galaxy_dragon', 'thunder_tiger', 'rune_golem', 'wind_falcon', 'crow_knight', 'magma_turtle'];
const TINT = ['', '', '', 'hue-rotate(35deg)', 'hue-rotate(-35deg)'];
const CUTE = MONS.slice(0, 17), COOL = MONS.slice(17);
function monSVG(w, opt) {
  opt = opt || {};
  const R = rng(hashStr(w.en.toLowerCase()));
  // 평소엔 귀여운 몬스터, 실수 없이 잡은 '반짝 몬스터'는 같은 자리의 멋진 몬스터로 변신!
  const r1 = R(), list = opt.shiny ? COOL : CUTE;
  const src = w.en === 'whaley' ? SEA + 'whale_happy.webp' : 'mon/' + list[Math.floor(r1 * list.length)] + '.webp';
  const tint = w.en === 'whaley' ? '' : TINT[Math.floor(R() * TINT.length)];
  const star = opt.shiny ? `<svg class="spk" viewBox="0 0 120 124"><g fill="#FFE45C"><path d="M14 18 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/><path d="M104 30 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/><path d="M98 100 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/></g></svg>` : '';
  return `<span class="m mi${opt.shiny ? ' sh' : ''}" style="--f:${tint || 'none'}"><img src="${src}" alt="" draggable="false">${star}</span>`;
}
function monSVGOld(w, opt) {
  opt = opt || {};
  const R = rng(hashStr(w.en.toLowerCase()));
  const h = Math.floor(R() * 360);
  const body = `hsl(${h} 78% 64%)`, dark = `hsl(${h} 62% 44%)`, belly = `hsl(${h} 90% 88%)`;
  const acc = `hsl(${(h + 150 + Math.floor(R() * 60)) % 360} 85% 62%)`;
  const shape = Math.floor(R() * 4), top = Math.floor(R() * 6), eyes = R() < .22 ? 1 : 2, mouth = Math.floor(R() * 4);
  const spots = R() < .5, arms = R() < .7;
  let s = '';
  // 등 장식
  if (top === 0) s += `<path d="M38 30 L30 8 L50 24 Z M82 30 L90 8 L70 24 Z" fill="${dark}"/>`;
  if (top === 1) s += `<circle cx="34" cy="22" r="11" fill="${dark}"/><circle cx="86" cy="22" r="11" fill="${dark}"/><circle cx="34" cy="22" r="5" fill="${belly}"/><circle cx="86" cy="22" r="5" fill="${belly}"/>`;
  if (top === 2) s += `<path d="M48 26 Q42 6 34 4 M72 26 Q78 6 86 4" stroke="${dark}" stroke-width="4" fill="none" stroke-linecap="round"/><circle cx="34" cy="5" r="6" fill="${acc}"/><circle cx="86" cy="5" r="6" fill="${acc}"/>`;
  if (top === 3) s += `<path d="M44 26 Q40 8 48 4 Q50 16 54 24 M76 26 Q80 8 72 4 Q70 16 66 24" fill="${acc}"/>`;
  if (top === 4) s += `<path d="M60 24 Q52 2 60 0 Q70 4 60 24" fill="#5FD068"/><path d="M60 22 Q74 6 82 12 Q72 22 60 22" fill="#4BB958"/>`;
  if (top === 5) s += `<path d="M40 30 Q50 6 60 20 Q70 6 80 30" fill="${acc}"/>`;
  // 몸
  const bodies = [
    `<ellipse cx="60" cy="70" rx="42" ry="40" fill="${body}"/>`,
    `<path d="M60 20 C92 20 100 60 98 82 C96 106 80 112 60 112 C40 112 24 106 22 82 C20 60 28 20 60 20Z" fill="${body}"/>`,
    `<path d="M16 76 C16 40 36 26 60 26 C84 26 104 40 104 76 L104 98 Q96 110 88 98 Q80 110 72 98 Q66 110 60 98 Q54 110 48 98 Q40 110 32 98 Q24 110 16 98Z" fill="${body}"/>`,
    `<rect x="20" y="28" width="80" height="82" rx="36" fill="${body}"/>`,
  ];
  if (arms) s += `<ellipse cx="18" cy="76" rx="9" ry="14" fill="${dark}" transform="rotate(-25 18 76)"/><ellipse cx="102" cy="76" rx="9" ry="14" fill="${dark}" transform="rotate(25 102 76)"/>`;
  s += `<ellipse cx="42" cy="112" rx="12" ry="7" fill="${dark}"/><ellipse cx="78" cy="112" rx="12" ry="7" fill="${dark}"/>`;
  s += bodies[shape];
  s += `<ellipse cx="60" cy="88" rx="26" ry="20" fill="${belly}" opacity=".9"/>`;
  if (spots) s += `<circle cx="30" cy="56" r="5" fill="${belly}" opacity=".7"/><circle cx="92" cy="62" r="4" fill="${belly}" opacity=".7"/><circle cx="86" cy="46" r="3" fill="${belly}" opacity=".7"/>`;
  s += `<ellipse cx="44" cy="42" rx="12" ry="7" fill="#fff" opacity=".3"/>`;
  // 얼굴
  const ey = 60;
  const eye = (x, r) => `<g class="eye"><circle cx="${x}" cy="${ey}" r="${r}" fill="#fff"/><circle cx="${x + 1.5}" cy="${ey + 1.5}" r="${r * .58}" fill="#1E2430"/><circle cx="${x + 3}" cy="${ey - 1.5}" r="${r * .22}" fill="#fff"/></g>`;
  s += eyes === 1 ? eye(60, 15) : eye(46, 10) + eye(74, 10);
  s += `<ellipse cx="32" cy="74" rx="6" ry="4" fill="#FF6F91" opacity=".55"/><ellipse cx="88" cy="74" rx="6" ry="4" fill="#FF6F91" opacity=".55"/>`;
  const my = 78;
  if (mouth === 0) s += `<path d="M52 ${my} Q60 ${my + 8} 68 ${my}" stroke="#1E2430" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  if (mouth === 1) s += `<path d="M50 ${my} Q60 ${my + 16} 70 ${my} Z" fill="#1E2430"/><path d="M56 ${my + 7} Q60 ${my + 11} 64 ${my + 7}" fill="#FF6F91"/>`;
  if (mouth === 2) s += `<path d="M50 ${my} Q55 ${my + 6} 60 ${my} Q65 ${my + 6} 70 ${my}" stroke="#1E2430" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  if (mouth === 3) s += `<path d="M50 ${my} Q60 ${my + 12} 70 ${my} Z" fill="#1E2430"/><path d="M54 ${my} L56 ${my + 5} L58 ${my}Z M62 ${my} L64 ${my + 5} L66 ${my}Z" fill="#fff"/>`;
  let wrap = s;
  // 필터 id 는 그릴 때마다 새로 — 숨은 화면에 있는 같은 id 를 가리키면 몸이 통째로 안 보인다
  const fid = 'shine' + (monSVG.n = (monSVG.n || 0) + 1);
  if (opt.shiny) wrap = `<g filter="url(#${fid})">${s}</g><g fill="#FFE45C"><path d="M14 18 l3 7 7 3 -7 3 -3 7 -3 -7 -7 -3 7 -3z"/><path d="M104 30 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/><path d="M98 100 l2 5 5 2 -5 2 -2 5 -2 -5 -5 -2 5 -2z"/></g>`;
  const defs = opt.shiny ? `<defs><filter id="${fid}"><feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#FFE45C"/></filter></defs>` : '';
  return `<svg class="m" viewBox="0 0 120 124" xmlns="http://www.w3.org/2000/svg">${defs}${wrap}</svg>`;
}

/* ═════════════ 웨일리 보카 진도·코인 연결 ═════════════ */
// 보카와 같은 사이트라 기기 저장소를 같이 쓴다. 보카에 로그인한 학생이 있으면
// 코인·도감·게임한 날을 그 학생 진도(swv.progress.<학생>)에 넣고, 보카와 똑같이 학원 서버에도 올린다.
// 로그인한 학생이 없으면 이 기기에만 저장한다(체험).
const VOCA_API = 'https://hello-world.a28008005.workers.dev';
const Voca = (function () {
  const rd = (k) => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
  const code = () => { try { return localStorage.getItem('swv.code'); } catch (e) { return null; } };
  const profile = rd('swv.profile');
  const on = !!(profile && profile.studentId);
  const pkey = on ? 'swv.progress.' + profile.studentId : '';
  let timer = 0;
  function push(p) {
    const c = code(); if (!c) return;
    clearTimeout(timer);
    timer = setTimeout(() => {
      fetch(VOCA_API + '/api/voca/save', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true,
        body: JSON.stringify({ code: c, levelId: profile.levelId || '', dayIdx: p.dayIdx || 0, progress: p }),
      }).catch(() => {});
    }, 800);
  }
  return {
    on, profile,
    prog() { return (on && rd(pkey)) || null; },
    update(fn) {
      if (!on) return null;
      const p = rd(pkey) || { dayIdx: 0, coins: 0 };
      fn(p);
      try { localStorage.setItem(pkey, JSON.stringify(p)); } catch (e) {}
      push(p);
      return p;
    },
  };
})();
// 도감: 보카 학생이면 진도 안 mon = {단어: [잡은 횟수, 반짝 0/1]}, 아니면 이 기기에
function getDex() {
  if (Voca.on) {
    const m = (Voca.prog() || {}).mon || {}; const out = {};
    for (const k in m) out[k] = { n: m[k][0], shiny: !!m[k][1] };
    return out;
  }
  return store.get('dex', {});
}
function addDex(w, shiny) {
  const k = key(w); let was = null;
  if (Voca.on) {
    Voca.update((p) => { p.mon = p.mon || {}; was = p.mon[k] || null; p.mon[k] = [(was ? was[0] : 0) + 1, (shiny || (was && was[1])) ? 1 : 0]; });
  } else {
    const dex = store.get('dex', {}); was = dex[k] || null;
    dex[k] = { n: (was ? was.n : 0) + 1, shiny: !!(shiny || (was && was.shiny)) }; store.set('dex', dex);
  }
  return !!was;
}
function bankCoins(n) { if (Voca.on) Voca.update((p) => { p.coins = (p.coins || 0) + n; }); else store.set('coins', store.get('coins', 0) + n); }
function totalCoins() { return Voca.on ? ((Voca.prog() || {}).coins || 0) : store.get('coins', 0); }

/* ═════════════ 홈 ═════════════ */
let sel = store.get('sel', { lv: 'lv240', vol: 1, unit: 1, day: 1 });
if (!DATA.levels.some((l) => l.id === sel.lv)) sel.lv = DATA.levels[0].id;
const QS = new URLSearchParams(location.search);
(function () {
  const setFrom = (id) => {
    const m = /^(\w+)-V(\d)U(\d)D(\d)$/.exec(id || '');
    if (!m || !DATA.levels.some((l) => l.id === m[1])) return false;
    sel = { lv: m[1], vol: +m[2], unit: +m[3], day: +m[4] };
    try { localStorage.setItem('wmon.sel', JSON.stringify(sel)); } catch (e) {}
    return true;
  };
  // 웨일리 보카에서 ?d=lv240-V1U2D3 로 들어오면 그날, 아니면 로그인한 학생의 보카 진도 날
  if (setFrom(QS.get('d'))) return;
  if (Voca.on) {
    const L = DATA.levels.find((l) => l.id === Voca.profile.levelId);
    const p = Voca.prog();
    if (L && p) setFrom((L.days[Math.min(p.dayIdx || 0, L.days.length - 1)] || {}).id);
  }
})();
const opts = store.get('opts', { text: false, slow: true });
const lvName = { phonics: '파닉스', lv240: '240', lv520: '520' };
function levelOf(id) { return DATA.levels.find((l) => l.id === id); }

let S = null;
function show(id) { ['home', 'play', 'result', 'dex'].forEach((x) => $('#' + x).classList.toggle('hidden', x !== id)); }

// 한 가지 게임만 고르면 그 게임을 두 판 (몬스터는 1~2번 맞히면 잡혀요)
function courseFor() {
  const mode = store.get('mode', 'course'), c = COURSE[sel.day];
  if (mode === 'course' || !GAMES[mode]) return c;
  return { day: GAMES[mode].name, games: [mode, mode], bonus: c.bonus };
}
function startSession() {
  const d = dayOf();
  const L = levelOf(sel.lv);
  const idx = L.days.indexOf(d);
  // 헷갈림 보기: 같은 날 단어 먼저, 모자라면 앞뒤 날에서
  const near = [];
  for (let k = -6; k <= 6; k++) { const dd = L.days[idx + k]; if (dd && k) dd.words.forEach((w) => near.push(w)); }
  S = {
    lv: sel.lv, day: d, course: courseFor(), round: 0, coins: 0, st: null,
    mons: d.words.map((w) => ({ w, gauge: 0, need: 3, miss: false, caught: false, shiny: false })),
    pool: near, queue: [], cur: -1, wrong: 0, game: null, busy: false, pending: [],
  };
  const nn = S.course.games.length;
  shuffle(S.mons.map((_, i) => i)).forEach((i, k) => { S.mons[i].need = 1 + (k % nn); });
  show('play');
  renderBar();
  WSOUND.sfx.resetSteps(); WSOUND.music.play(S.course.games.every((x) => x === 'stairs') ? 'stairs' : 'sea');
  nextRound();
}
async function nextRound() {
  if (S.round >= S.course.games.length) return finish();
  const g = S.course.games[S.round];
  $('#gLbl').textContent = `${GAMES[g].icon} ${GAMES[g].name}`;
  $('#play').className = 'screen';
  $('#iIcon').innerHTML = `<img src="${SEA}${GAMES[g].img}.webp" alt="">`; $('#iName').textContent = GAMES[g].name; $('#iHow').textContent = GAMES[g].how;
  $('#iRound').textContent = `${S.round + 1}번째 게임 / ${S.course.games.length}`;
  $('#intro').classList.remove('hidden'); SFX.whoosh();
  await sleep(1700);
  $('#intro').classList.add('hidden');
  S.queue = shuffle(S.mons.map((_, i) => i));
  S.qTotal = S.queue.length; S.qDone = 0;
  nextTarget();
}
function renderDots() {
  const n = S.qTotal || 1;
  $('#gDots').innerHTML = Array.from({ length: n }, (_, i) => `<i class="${i < S.qDone ? 'done' : i === S.qDone ? 'cur' : ''}"></i>`).join('');
}
function options(w) {
  const want = w.p ? (x) => x.p : () => true;
  const same = S.mons.map((m) => m.w).filter((x) => key(x) !== key(w) && want(x));
  const far = shuffle(S.pool.filter((x) => key(x) !== key(w) && want(x) && !same.some((y) => key(y) === key(x))));
  const seen = new Set([key(w)]); const out = [];
  for (const x of shuffle(same).concat(far)) { if (out.length >= 3) break; if (!seen.has(key(x))) { seen.add(key(x)); out.push(x); } }
  return shuffle([w].concat(out));
}
async function nextTarget() {
  if (S.game) { S.game.stop(); S.game = null; }
  if (!S.queue.length) {
    // 이 게임에서 잡은 몬스터를 한꺼번에
    if (S.pending.length) {
      const got = S.pending; S.pending = [];
      await catchShow(got);
      if (!S) return;
      got.forEach((m) => addCoins(m.shiny ? 50 : 20));
    }
    S.round++; return nextRound();
  }
  S.cur = S.queue.shift(); S.wrong = 0; S.busy = false;
  renderDots(); renderBar();
  const w = S.mons[S.cur].w;
  $('#sayTxt').textContent = pick(['잘 듣고 찾아요!', '어떤 걸까?', '귀를 쫑긋!', '찾을 수 있어!']);
  const g = S.course.games[S.round];
  S.game = (g === 'bubble' ? Bubble : g === 'mole' ? Mole : g === 'stairs' ? Stairs : Fish)($('#stage'), w, options(w), answer);
  setTimeout(() => say(w), 350);
}
const musBtn = () => { $('#musBtn').textContent = WSOUND.music.isOn() ? '🎵' : '🔇'; };
$('#musBtn').onclick = () => { WSOUND.music.toggle(); musBtn(); }; musBtn();

function addCoins(n) {
  S.coins += n; $('#coinN').textContent = S.coins;

// 게임이 정답/오답을 알려 준다. ok 이면 그 게임은 이미 효과를 마친 뒤다.
async function answer(ok) {
  if (!S) return;
  const m = S.mons[S.cur];
  if (!ok) {
    m.miss = true; S.wrong++; SFX.no();
    setTimeout(() => say(m.w), 400);
    if (S.wrong >= 2 && S.game && S.game.hint) S.game.hint();
    return;
  }
  if (S.busy) return; S.busy = true;
  SFX.ok();
  m.gauge = Math.min(m.need, m.gauge + 1);
  if (m.gauge >= m.need && !m.caught) {
    m.caught = true;
    m.shiny = !m.miss && (S.course.bonus ? Math.random() < .7 : Math.random() < .35);
    S.pending.push(m);
  }
  addCoins(S.wrong ? 5 : 10);
  S.qDone++; renderDots();
  renderBar(S.cur);
  await sleep(650);
  if (!S) return;
  nextTarget();
}
function renderBar(hitIdx) {
  $('#bar').innerHTML = S.mons.map((m, i) => `<div class="slot ${m.caught ? 'caught' : ''} ${i === S.cur && !m.caught ? 'cur' : ''} ${i === hitIdx ? 'hit' : ''}">
    ${monSVG(m.w, { shiny: m.caught && m.shiny })}<div class="pips">${Array.from({ length: m.need }, (_, k) => `<i class="${k < m.gauge ? 'on' : ''}"></i>`).join('')}</div></div>`).join('');
}

const face = (w) => (w.p ? `<img class="pic" src="pic/${w.p}.jpg" alt="">` : `<div class="txt" style="font-size:22px">${w.en}</div>`) + (opts.text && w.p ? `<span class="lab">${w.en}</span>` : '');

/* ═════════════ 게임 1: 버블팡 ═════════════ */
function Bubble(stage, target, list, cb) {
  stage.className = 'stage g-bubble'; stage.innerHTML = '';
  const W = stage.clientWidth, H = stage.clientHeight;
  const bs = Math.min(W / 4.2, H / 3.2, 190);
  const speed = (opts.slow ? H / 9 : H / 6);
  const lanes = shuffle([0, 1, 2, 3]);
  let alive = true, raf = 0, last = performance.now(), t0 = last;
  const B = list.map((w, i) => {
    const el = document.createElement('button'); el.className = 'bub'; el.style.setProperty('--bs', bs + 'px');
    el.innerHTML = `<div class="inner">${face(w)}</div>`;
    const laneW = W / 4;
    const b = { w, el, x: laneW * lanes[i] + (laneW - bs) / 2, y: H * .38 + ((i * 0.37) % 1) * H * .45 + rnd(0, 30), ph: rnd(0, 6), sp: speed * rnd(.85, 1.15), done: false };
    el.onpointerdown = (e) => {
      e.preventDefault(); if (!alive || b.done) return;
      if (key(w) === key(target)) {
        b.done = true; alive = false; SFX.pop();
        el.style.setProperty('--t', el.style.transform); el.classList.add('pop');
        sparks(stage, b.x + bs / 2, b.y + bs / 2);
        B.forEach((o) => { if (o !== b) { o.done = true; o.el.style.transition = 'opacity .4s'; o.el.style.opacity = '.25'; } });
        setTimeout(() => cb(true), 450);
      } else { el.classList.remove('shake'); void el.offsetWidth; el.classList.add('shake'); cb(false); }
    };
    stage.append(el); return b;
  });
  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    B.forEach((b) => {
      if (!b.done || !alive) { if (alive) b.y -= b.sp * dt; }
      if (b.y < -bs) b.y = H + rnd(10, 80);
      const x = b.x + Math.sin((now - t0) / 700 + b.ph) * 14;
      b.el.style.transform = `translate(${x}px,${b.y}px)`;
    });
    raf = requestAnimationFrame(loop);
  }
  raf = requestAnimationFrame(loop);
  return {
    stop() { alive = false; cancelAnimationFrame(raf); },
    hint() { B.forEach((b) => { if (key(b.w) === key(target)) { b.el.classList.add('glow'); b.sp *= .5; } }); },
  };
}

/* ═════════════ 게임 4: 바다 계단 (무한 계단) ═════════════ */
// 소리를 듣고 맞는 그림이 있는 쪽 계단으로 한 칸씩 올라간다. 계단은 한 판 동안 계속 이어진다.
function Stairs(stage, target, list, cb) {
  stage.className = 'stage g-stairs';
  const W = stage.clientWidth, H = stage.clientHeight;
  const sw = Math.min(W * .3, 150), sh = Math.min(H * .1, 70), ch = Math.min(H * .16, 96);
  if (!S.st) S.st = { steps: [{ x: 0, y: 0 }], i: 0, floor: 0 };
  const st = S.st, cur = st.steps[st.i];
  // 다음 계단 방향: 화면 밖으로 나가지 않게
  let dir = Math.random() < .5 ? -1 : 1;
  if (cur.x + dir * sw * .7 > W / 2 - sw * .6 || cur.x + dir * sw * .7 < -W / 2 + sw * .6) dir = -dir;
  st.steps = st.steps.slice(0, st.i + 1); st.steps.push({ x: cur.x + dir * sw * .7, y: cur.y + sh });
  const other = list.find((w) => key(w) !== key(target)) || target;
  const sideL = dir < 0 ? target : other, sideR = dir < 0 ? other : target;
  const baseY = H * .56;
  const camOf = (i) => -(st.steps[i].y);
  stage.innerHTML = `<div class="stfl">🪜 <span>${st.floor}</span>층</div><div class="stw"></div>
    <div class="stbtns"><button class="stb l"><span class="arr">◀</span>${face(sideL)}</button><button class="stb r"><span class="arr">▶</span>${face(sideR)}</button></div>`;
  const world = stage.querySelector('.stw');
  const from = Math.max(0, st.i - 9);
  st.steps.forEach((p, i) => {
    if (i < from || i > st.i) return; // 다음 계단은 미리 보여 주지 않아요(정답 쪽이 들키니까)
    const e = document.createElement('div'); e.className = 'step' + (i === st.i ? ' on' : '');
    e.style.cssText = `left:${W / 2 + p.x - sw / 2}px;top:${baseY - p.y}px;width:${sw}px`;
    world.append(e);
  });
  const kid = document.createElement('img'); kid.className = 'stc'; kid.src = SEA + 'whale_happy.webp';
  const place = (p, flip) => { kid.style.cssText = `left:${W / 2 + p.x - ch / 2}px;top:${baseY - p.y - ch + 6}px;width:${ch}px;transform:scaleX(${flip ? -1 : 1})`; };
  place(cur, dir < 0); world.append(kid);
  world.style.transform = `translateY(${-camOf(st.i)}px)`;
  let alive = true;
  const btns = stage.querySelectorAll('.stb');
  btns.forEach((b, bi) => {
    const w = bi ? sideR : sideL;
    b.onpointerdown = (e) => {
      e.preventDefault(); if (!alive) return;
      if (key(w) === key(target)) {
        alive = false; st.i++; st.floor++;
        kid.style.transition = 'left .38s ease-out, top .38s ease-out'; place(st.steps[st.i], dir < 0);
        kid.classList.add('hop'); SFX.jump(); WSOUND.music.tempo(1 + Math.min(st.floor, 40) / 80);
        world.style.transition = 'transform .45s ease-out'; world.style.transform = `translateY(${-camOf(st.i)}px)`;
        stage.querySelector('.stfl span').textContent = st.floor;
        const ne = document.createElement('div'); ne.className = 'step on'; const np = st.steps[st.i];
        ne.style.cssText = `left:${W / 2 + np.x - sw / 2}px;top:${baseY - np.y}px;width:${sw}px;animation:appear .25s`; world.insertBefore(ne, kid);
        setTimeout(() => cb(true), 480);
      } else { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); kid.classList.remove('oops'); void kid.offsetWidth; kid.classList.add('oops'); cb(false); }
    };
  });
  return {
    stop() { alive = false; },
    hint() { btns[dir < 0 ? 0 : 1].classList.add('glow'); },
  };
}

/* ═════════════ 게임 2: 두더지 잡기 ═════════════ */
const MOLE_SVG = `<svg viewBox="0 0 120 100"><ellipse cx="60" cy="70" rx="44" ry="40" fill="#9A6A42"/><ellipse cx="60" cy="80" rx="28" ry="22" fill="#D8B48A"/>
  <circle cx="44" cy="54" r="8" fill="#fff"/><circle cx="76" cy="54" r="8" fill="#fff"/><circle cx="45" cy="55" r="4.5" fill="#1E2430"/><circle cx="77" cy="55" r="4.5" fill="#1E2430"/>
  <ellipse cx="60" cy="68" rx="9" ry="7" fill="#FF7FA0"/><path d="M52 78 Q60 84 68 78" stroke="#1E2430" stroke-width="3" fill="none" stroke-linecap="round"/>
  <ellipse cx="30" cy="68" rx="6" ry="4" fill="#FF8FA8" opacity=".6"/><ellipse cx="90" cy="68" rx="6" ry="4" fill="#FF8FA8" opacity=".6"/>
  <ellipse cx="24" cy="40" rx="9" ry="12" fill="#7E5233"/><ellipse cx="96" cy="40" rx="9" ry="12" fill="#7E5233"/></svg>`;
function Mole(stage, target, list, cb) {
  stage.className = 'stage g-mole'; stage.innerHTML = '<div class="holes"></div>';
  const wrap = stage.querySelector('.holes');
  let alive = true, timers = [], sinceTarget = 0, hinted = false;
  const H = Array.from({ length: 6 }, () => {
    const h = document.createElement('div'); h.className = 'hole';
    h.innerHTML = `<button class="mole"><div class="sign"></div><img class="mbody" src="${SEA}${pick(['otter', 'crab', 'seal', 'penguin', 'turtle', 'octo'])}.webp" alt="" draggable="false"></button>`;
    wrap.append(h);
    const o = { h, m: h.querySelector('.mole'), s: h.querySelector('.sign'), up: false, w: null };
    o.m.onpointerdown = (e) => {
      e.preventDefault(); if (!alive || !o.up) return;
      if (key(o.w) === key(target)) {
        alive = false; SFX.bonk(); o.m.classList.add('bonk');
        const st = document.createElement('div'); st.className = 'stars'; st.textContent = '💫⭐'; o.h.append(st);
        timers.forEach(clearTimeout);
        setTimeout(() => { H.forEach((x) => x.m.classList.remove('up')); cb(true); }, 550);
      } else {
        o.m.classList.remove('miss'); void o.m.offsetWidth; o.m.classList.add('miss'); cb(false);
        setTimeout(() => down(o), 380);
      }
    };
    return o;
  });
  // 두더지 크기는 구멍의 가로·세로 둘 다에 맞춘다. 가로로 눕힌 태블릿은 구멍이 납작해서
  // 가로만 보고 키우면 그림 카드가 위로 잘려 얼굴만 보였다. (두더지+카드 높이 ≈ 너비 × 1.55)
  {
    const r = H[0].h.getBoundingClientRect();
    const mw = Math.max(60, Math.min(r.width * .74, r.height * .92 / 1.55));
    H.forEach((o) => { o.m.style.width = mw + 'px'; });
  }
  function down(o) { o.up = false; o.m.classList.remove('up', 'bonk', 'miss', 'glow'); }
  function popOne() {
    if (!alive) return;
    const free = H.filter((o) => !o.up);
    const upNow = H.filter((o) => o.up);
    // 한 번에 최대 3마리, 같은 그림은 동시에 안 나온다
    const others = list.filter((w) => key(w) !== key(target) && !upNow.some((x) => key(x.w) === key(w)));
    if (free.length && upNow.length < 3) {
      const o = pick(free);
      const targetUp = upNow.some((x) => key(x.w) === key(target));
      const showTarget = !targetUp && (sinceTarget >= 1 || Math.random() < .5 || !others.length);
      if (!showTarget && !others.length) { timers.push(setTimeout(popOne, 400)); return; }
      o.w = showTarget ? target : pick(others);
      sinceTarget = showTarget ? 0 : sinceTarget + 1;
      o.s.innerHTML = face(o.w);
      o.up = true; o.m.classList.add('up');
      if (hinted && showTarget) o.m.classList.add('glow');
      const stay = (opts.slow ? 2900 : 2100) * rnd(.85, 1.2);
      timers.push(setTimeout(() => { if (alive && o.up) down(o); }, stay));
    }
    timers.push(setTimeout(popOne, (opts.slow ? 900 : 650) * rnd(.7, 1.3)));
  }
  timers.push(setTimeout(popOne, 300)); timers.push(setTimeout(popOne, 700));
  return {
    stop() { alive = false; timers.forEach(clearTimeout); },
    hint() { hinted = true; H.forEach((o) => { if (o.up && key(o.w) === key(target)) o.m.classList.add('glow'); }); },
  };
}

/* ═════════════ 게임 3: 물고기 낚시 ═════════════ */
function fishSVG(col) {
  return `<svg viewBox="0 0 140 90"><path d="M104 45 L136 18 L130 45 L136 72Z" fill="${col}" opacity=".9"/>
    <ellipse cx="62" cy="45" rx="52" ry="38" fill="${col}"/><path d="M50 10 Q66 -4 80 10" fill="${col}"/>
    <ellipse cx="62" cy="58" rx="36" ry="20" fill="#fff" opacity=".25"/>
    <circle cx="22" cy="38" r="8" fill="#fff"/><circle cx="20" cy="39" r="4.5" fill="#1E2430"/>
    <path d="M10 54 Q16 58 22 54" stroke="#1E2430" stroke-width="3" fill="none" stroke-linecap="round"/></svg>`;
}
function Fish(stage, target, list, cb) {
  stage.className = 'stage g-fish';
  stage.innerHTML = `<div class="wave"></div><div class="bubbles-bg">${Array.from({ length: 10 }, () => `<i style="left:${rnd(0, 100)}%;animation-duration:${rnd(5, 10)}s;animation-delay:${rnd(0, 6)}s"></i>`).join('')}</div>
    <img class="boat" src="../arcade/img/kidboat.webp" alt="">
    <div class="line"></div><svg class="hook" viewBox="0 0 26 26"><path d="M13 0 V14 a6 6 0 1 1 -6 -6" stroke="#E8EEF3" stroke-width="3.5" fill="none" stroke-linecap="round"/></svg>`;
  const W = stage.clientWidth, Hh = stage.clientHeight;
  const fs = Math.min(W / 3.4, Hh / 3.3, 210);
  const line = stage.querySelector('.line'), hook = stage.querySelector('.hook');
  // 낚시하는 아이 보트: 낚싯대 끝(그림의 98%, 11% 지점)에서 줄이 내려가요
  const boatEl = stage.querySelector('.boat'), BW = Math.min(W * .44, 180), BH = BW * 271 / 360;
  const boatL = W / 2 - BW * .62, boatT = Math.max(4, Hh * .15 - BH);
  Object.assign(boatEl.style, { width: BW + 'px', left: boatL + 'px', top: boatT + 'px' });
  const boatX = boatL + BW * .975, rodY = boatT + BH * .11;
  let hookX = boatX, hookY = rodY + 10;
  function setHook(x, y, ms) {
    hook.style.transition = `top ${ms}ms ease-in-out, left ${ms}ms ease-in-out`;
    hook.style.left = x + 'px'; hook.style.top = y + 'px'; hookX = x; hookY = y;
  }
  function drawLine() {
    const hx = hook.offsetLeft + 11, hy = hook.offsetTop;
    const dx = hx - boatX, dy = hy - rodY; const len = Math.hypot(dx, dy);
    line.style.left = boatX + 'px'; line.style.top = rodY + 'px'; line.style.height = len + 'px';
    line.style.transform = `rotate(${Math.atan2(-dx, dy)}rad)`;
  }
  setHook(boatX, rodY + 10, 0);
  const FISH = shuffle([{ k: 'clown_swim', b: -1 }, { k: 'whale_swim', b: -1 }, { k: 'turtle_swim', b: 1 }, { k: 'octo_swim', b: 1 }, { k: 'seal_swim', b: 1 }, { k: 'puffer', b: 1 }]);
  const lanesY = shuffle([.3, .47, .64, .81]).map((p) => Hh * p - fs * .32);
  let alive = true, busy = false, raf = 0, last = performance.now();
  const base = (opts.slow ? W / 9 : W / 6);
  const F = list.map((w, i) => {
    const el = document.createElement('button'); el.className = 'fish'; el.style.setProperty('--fs', fs + 'px');
    const fk = FISH[i % FISH.length]; el.style.setProperty('--b', fk.b);
    el.innerHTML = `<img class="fb" src="${SEA}${fk.k}.webp" alt="" draggable="false"><div class="tag">${face(w)}</div>`;
    const dir = i % 2 ? 1 : -1;
    const f = { w, el, x: dir > 0 ? rnd(-fs, W * .3) : rnd(W * .5, W), y: lanesY[i], dir, sp: base * rnd(.8, 1.2), dash: 0, hooked: false };
    if (dir > 0) el.classList.add('flip');
    el.onpointerdown = (e) => {
      e.preventDefault(); if (!alive || busy || f.hooked) return;
      busy = true;
      const tx = f.x + fs * .5 - 11, ty = f.y + fs * .25;
      setHook(tx, ty, 380);
      setTimeout(() => {
        if (!alive) return;
        if (key(w) === key(target)) {
          f.hooked = true; alive = false; SFX.splash();
          f.el.style.transition = 'transform .7s ease-in';
          f.el.style.transform = `translate(${boatX - fs * .4}px,${rodY - fs * .2}px) rotate(${f.dir * 70}deg) scale(.6)`;
          setHook(boatX, rodY, 700);
          setTimeout(() => {
            const sp = document.createElement('div'); sp.className = 'splash'; sp.textContent = '💦✨';
            sp.style.left = boatX + 'px'; sp.style.top = rodY + 'px'; stage.append(sp);
          }, 600);
          setTimeout(() => cb(true), 900);
        } else {
          f.dash = 1.2; f.dir *= -1; f.el.classList.toggle('flip');
          setHook(boatX, rodY + 10, 420); busy = false; cb(false);
        }
      }, 400);
    };
    stage.append(el); return f;
  });
  function loop(now) {
    const dt = Math.min(.05, (now - last) / 1000); last = now;
    F.forEach((f) => {
      if (!f.hooked && alive) {
        const sp = f.sp * (f.dash > 0 ? 3 : 1); f.dash = Math.max(0, f.dash - dt);
        f.x += f.dir * sp * dt;
        if (f.x > W + 10) { f.dir = -1; f.el.classList.remove('flip'); }
        if (f.x < -fs - 10) { f.dir = 1; f.el.classList.add('flip'); }
        const bob = Math.sin(now / 500 + f.y) * 6;
        f.el.style.transform = `translate(${f.x}px,${f.y + bob}px)`;
      }
    });
    drawLine();
    raf = requestAnimationFrame(loop);
  }
  raf = requestAnimationFrame(loop);
  return {
    stop() { alive = false; setTimeout(() => cancelAnimationFrame(raf), 900); },
    hint() { F.forEach((f) => { if (key(f.w) === key(target)) { f.el.classList.add('glow'); f.sp *= .4; } }); },
  };
}

/* ═════════════ 결과 · 도감 ═════════════ */
/* ───────── 학원 순위표 (레벨별 오늘 TOP 5 · 이번 달 누적 TOP 5 · 다 함께 쌓은 숫자) ─────────
   웨일리 보카에 로그인한 학생은 기록이 학원 서버에 올라가고, 아니면 순위만 본다. */
const RANK = (() => {
  const API = 'https://hello-world.a28008005.workers.dev/api/game/score';
  const TEAM = { stairs: ['함께 오른 계단', '층'], run: ['함께 통과한 정답 문', '개'], obby: ['함께 건넌 문장', '개'], sea: ['함께 잡은 몬스터', '마리'] };
  const UNIT = { stairs: '층', run: '점', obby: '점', sea: '코인' };
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const code = () => { try { return localStorage.getItem('swv.code') || ''; } catch (e) { return ''; } };
  function list(rows, unit) {
    if (!rows.length) return '<div class="rk-empty">아직 기록이 없어요. 첫 번째 주인공이 되어 볼까요?</div>';
    return rows.map((r) => `<div class="rk-row${r.me ? ' me' : ''}"><span class="rk-n">${['🥇', '🥈', '🥉'][r.rank - 1] || r.rank}</span><b>${esc(r.name)}${r.me ? ' <i>나</i>' : ''}</b><span class="rk-s">${r.score.toLocaleString()}${unit}</span></div>`).join('');
  }
  async function show(box, game, level, score, amount) {
    if (!box) return;
    const c = code();
    box.innerHTML = '<div class="rk"><div class="rk-load">🏆 우리 학원 순위 불러오는 중…</div></div>';
    let d = null;
    try {
      const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(c ? { code: c, game, level, score, amount } : { game, level }) });
      d = await res.json();
    } catch (e) { d = null; }
    if (!d || !d.success) { box.innerHTML = ''; return; }
    const unit = UNIT[game] || '점', tm = TEAM[game] || ['함께 쌓은 기록', ''];
    const lvName = { phonics: '파닉스', lv240: '240', lv520: '520', lv860: '860' }[level] || level;
    const my = (n, total) => n ? `<div class="rk-my">내 순위 <b>${n}등</b> / ${total}명</div>` : '';
    box.innerHTML = `<div class="rk">
      <div class="rk-team">🤝 오늘 우리 학원 친구 ${d.team.friends}명이 ${tm[0]} <b>${d.team.amount.toLocaleString()}${tm[1]}</b></div>
      <div class="rk-h"><span>🏆 ${lvName} 순위</span><div class="rk-tabs"><button class="on" data-t="today">오늘 TOP 5</button><button data-t="month">이번 달 누적</button></div></div>
      <div class="rk-p" data-p="today">${list(d.today, unit)}${my(d.myToday, d.players.today)}</div>
      <div class="rk-p" data-p="month" hidden>${list(d.month, unit)}${my(d.myMonth, d.players.month)}<div class="rk-note">날마다의 최고 기록을 더한 점수예요. 매일 오면 쑥쑥 올라가요!</div></div>
      ${c ? '' : '<div class="rk-note">웨일리 보카에 로그인하고 하면 내 기록도 순위에 올라가요</div>'}
    </div>`;
    box.querySelectorAll('.rk-tabs button').forEach((b) => b.onclick = () => {
      box.querySelectorAll('.rk-tabs button').forEach((x) => x.classList.toggle('on', x === b));
      box.querySelectorAll('.rk-p').forEach((p) => { p.hidden = p.dataset.p !== b.dataset.t; });
    });
  }
  return { show };
})();

function finish() {
  WSOUND.music.stop();
  if (S.game) { S.game.stop(); S.game = null; }
  const caught = S.mons.filter((m) => m.caught), shiny = caught.filter((m) => m.shiny).length;
  // 오늘 게임한 날을 진도에 남긴다 (보카 홈에서 '완료'로 보인다)
  // 한 판을 끝냈으면 '오늘 공부함'으로도 적어 둔다 → 보카가 다음 날 처음 열릴 때 진도를 한 칸 넘긴다.
  // (보카의 현재 진도 날과 같은 날을 했을 때만 적는다. 복습이나 다른 날을 한 것은 진도에 영향이 없다.)
  if (Voca.on) Voca.update((p) => {
    p.gameDays = p.gameDays || {}; p.gameDays[S.day.id] = caught.length;
    const L = DATA.levels.find((l) => l.id === (Voca.profile.levelId || ''));
    const cur = L && L.days[Math.min(p.dayIdx || 0, L.days.length - 1)];
    if (cur && cur.id === S.day.id) {
      const d = new Date(), t = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
      const same = p.partial && p.partial.dayId === cur.id && p.partial.date === t;
      p.partial = { lid: L.id, dayId: cur.id, date: t, steps: same ? (p.partial.steps || 1) : 1, src: same ? (p.partial.src || 'game') : 'game' };
    }
  });
  confetti(); SFX.catch();
  $('#resultIn').innerHTML = `
    <div style="text-align:center"><div style="font-size:64px">🏆</div>
      <h1 class="jua" style="font-weight:400;font-size:38px;margin:4px 0">${caught.length}마리 다 잡았다!</h1>
      <div style="color:#9FD8F5">${S.day.label} · ${S.course.day} 코스 완료</div></div>
    <div class="stat"><div><b>${caught.length}</b><span>모은 몬스터</span></div><div><b>${shiny}</b><span>반짝 몬스터</span></div><div><b>+${S.coins}</b><span>${Voca.on ? '보카 코인 (총 ' + totalCoins().toLocaleString() + ')' : '코인'}</span></div></div>
    <div class="grid">${caught.map((m) => `<button class="mon" data-k="${reg(m.w)}">${m.shiny ? '<span class="sh">✨</span>' : ''}${monSVG(m.w, { shiny: m.shiny })}<b>${monName(m.w)}</b><small>${m.w.en} · ${m.w.ko}</small></button>`).join('')}</div>
    <div id="rRank"></div>
    <button class="big" id="rNext">다음 날 도전 ▶</button>
    <div class="row2"><button class="ghost" id="rAgain">다시 하기</button><button class="ghost" id="rDex">📖 도감</button><button class="ghost" id="rHome">처음으로</button></div>`;
  show('result');
  const onlyStairs = S.course.games.every((x) => x === 'stairs');
  RANK.show($('#rRank'), onlyStairs ? 'stairs' : 'sea', S.lv, onlyStairs ? (S.st ? S.st.floor : 0) : S.coins, onlyStairs ? (S.st ? S.st.floor : 0) : caught.length);
  $('#rAgain').onclick = startSession;
  $('#rHome').onclick = () => { S = null; show('home'); renderHome(); };
  $('#rDex').onclick = () => showDex(S.lv);
  $('#rNext').onclick = () => {
    if (sel.day < 5) sel.day++; else { sel.day = 1; if (sel.unit < 4) sel.unit++; else { sel.unit = 1; sel.vol = Math.min(6, sel.vol + 1); } }
    save(); startSession();
  };
}
function showDex(lv) {
  const dex = getDex();
  const L = levelOf(lv);
  const all = []; const seen = new Set();
  L.days.forEach((d) => d.words.forEach((w) => { if (!seen.has(key(w))) { seen.add(key(w)); all.push({ w, d }); } }));
  const mine = all.filter((x) => dex[key(x.w)]);
  const shiny = mine.filter((x) => dex[key(x.w)].shiny).length;
  // 잡은 것 + 지금 Vol 의 못 잡은 것(그림자)
  const vol = `-V${sel.vol}U`;
  const locked = all.filter((x) => !dex[key(x.w)] && x.d.id.includes(vol)).slice(0, 40);
  $('#dexIn').innerHTML = `
    <div class="title"><div style="font-size:44px">📖</div><div><h1>몬스터 도감</h1><small>${Voca.on ? (Voca.profile.name || '') + ' 님이 ' : ''}단어를 맞혀서 모은 몬스터들이에요. 누르면 소리가 나요.</small></div></div>
    <div class="tabs">${DATA.levels.map((x) => `<button class="chip ${x.id === lv ? 'on' : ''}" data-lv="${x.id}">${lvName[x.id]}</button>`).join('')}</div>
    <div class="stat"><div><b>${mine.length}<span style="font-size:16px;color:#9FD8F5"> / ${all.length}</span></b><span>모은 몬스터</span></div><div><b>${shiny}</b><span>반짝 몬스터</span></div><div><b>${totalCoins().toLocaleString()}</b><span>${Voca.on ? '보카 코인' : '누적 코인'}</span></div></div>
    <div class="grid">
      ${mine.map((x) => { const r = dex[key(x.w)]; return `<button class="mon" data-k="${reg(x.w)}">${r.shiny ? '<span class="sh">✨</span>' : ''}${monSVG(x.w, { shiny: r.shiny })}<b>${monName(x.w)}</b><small>${x.w.en} · ${x.w.ko}</small></button>`; }).join('')}
      ${locked.map((x) => `<div class="mon lock">${monSVG(x.w)}<b>???</b><small>${x.d.label.replace('Vol.', 'V')}</small></div>`).join('')}
    </div>
    <button class="big" id="dHome">돌아가기</button>`;
  show('dex');
  document.querySelectorAll('#dexIn [data-lv]').forEach((b) => (b.onclick = () => showDex(b.dataset.lv)));
  $('#dHome').onclick = () => { show(S ? 'result' : 'home'); if (!S) renderHome(); };
}

renderHome();
