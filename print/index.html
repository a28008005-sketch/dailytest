<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>데일리 워크시트 인쇄</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🖨️</text></svg>">
<style>
:root {
  --navy: #003C70;
  --bg: #F4F6F9;
  --card: #FFFFFF;
  --ink: #1B2430;
  --sub: #5B6776;
  --line: #E1E6EC;
  --chip: #F0F3F7;
  --lv: #003C70;
  --lv-soft: #E8EEF5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11161D; --card: #1A212B; --ink: #E7ECF2; --sub: #9AA6B4; --line: #2B3440; --chip: #232C38;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.5 "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif; }
header { background: var(--navy); color: #fff; padding: 18px 16px 16px; }
header .in, main { max-width: 880px; margin: 0 auto; }
header h1 { margin: 0; font-size: 22px; letter-spacing: -0.02em; }
header p { margin: 4px 0 0; font-size: 14px; opacity: .8; }
main { padding: 16px 16px 48px; }
.step { font-size: 13px; font-weight: 700; color: var(--sub); margin: 20px 0 8px; }
.levels { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.levels button { border: 2px solid transparent; border-radius: 12px; padding: 12px 4px; font: inherit; font-weight: 800; font-size: 17px; cursor: pointer; background: var(--card); color: var(--c); box-shadow: 0 1px 2px rgba(0,0,0,.06); }
.levels button[aria-pressed="true"] { background: var(--c); color: #fff; }
.seg { display: inline-flex; background: var(--chip); border-radius: 12px; padding: 4px; }
.seg button { border: 0; background: none; font: inherit; font-weight: 700; padding: 8px 16px; border-radius: 9px; cursor: pointer; color: var(--sub); }
.seg button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 1px 3px rgba(0,0,0,.12); }
.vols { display: grid; gap: 10px; }
.vol { background: var(--card); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; }
.vol-head { display: flex; align-items: center; gap: 12px; padding: 12px 14px; }
.vol-head .t { font-weight: 800; font-size: 18px; color: var(--lv); min-width: 64px; }
.vol-head .m { color: var(--sub); font-size: 13px; flex: 1; }
.btn { border: 0; border-radius: 10px; padding: 10px 14px; font: inherit; font-weight: 700; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn.primary { background: var(--lv); color: #fff; }
.btn.ghost { background: var(--chip); color: var(--ink); }
.btn:disabled { opacity: .45; cursor: default; }
.days { border-top: 1px solid var(--line); padding: 10px 14px 14px; display: none; }
.vol.open .days { display: block; }
.unit { display: flex; align-items: center; gap: 6px; margin: 6px 0; flex-wrap: wrap; }
.unit .u { width: 56px; font-size: 13px; font-weight: 700; color: var(--sub); }
.day { border: 1.5px solid var(--line); background: var(--card); color: var(--ink); border-radius: 9px; padding: 6px 10px; font: inherit; font-size: 14px; cursor: pointer; min-width: 64px; text-align: center; }
.day small { display: block; font-size: 11px; color: var(--sub); }
.day[aria-pressed="true"] { border-color: var(--lv); background: var(--lv-soft); color: var(--lv); font-weight: 700; }
.day[aria-pressed="true"] small { color: var(--lv); }
.bar { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; align-items: center; }
.bar .hint { font-size: 13px; color: var(--sub); flex: 1; min-width: 180px; }
.all { margin-top: 20px; background: var(--card); border: 1px dashed var(--line); border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.all .m { flex: 1; color: var(--sub); font-size: 14px; min-width: 180px; }
.help { margin-top: 24px; font-size: 14px; color: var(--sub); background: var(--card); border-radius: 14px; padding: 14px 16px; border: 1px solid var(--line); }
.help b { color: var(--ink); }
.help ol { margin: 6px 0 0; padding-left: 20px; }
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); background: #1B2430; color: #fff; padding: 10px 16px; border-radius: 10px; font-size: 14px; display: none; max-width: calc(100% - 32px); }
footer { text-align: center; color: var(--sub); font-size: 12px; padding: 0 16px 24px; }
@media (max-width: 560px) {
  .levels { grid-template-columns: repeat(3, 1fr); }
  .vol-head { flex-wrap: wrap; }
  .vol-head .m { flex-basis: 100%; order: 3; }
  .unit .u { width: 100%; }
  .day { min-width: 0; flex: 1; }
}
</style>
</head>
<body>
<header><div class="in">
  <h1>데일리 워크시트 인쇄</h1>
  <p>고래영어 · 레벨과 권을 고르고, 필요한 DAY만 골라 뽑으세요</p>
</div></header>
<main>
  <div class="step">① 레벨</div>
  <div class="levels" id="levels"></div>

    <button data-k="pic" aria-pressed="true">그림 있음</button>
    <button data-k="plain" aria-pressed="false">그림 없음</button>
  </div>

  <div class="step">③ 권 · DAY</div>
  <div class="vols" id="vols"></div>

  <div class="all" id="all"></div>

  <div class="help">
    <b>뽑는 법</b>
    <ol>
      <li><b>권 전체</b>는 <b>열기</b>를 누르면 PDF가 새 탭에 열립니다. 거기서 인쇄(Ctrl+P)하세요.</li>
      <li><b>몇 날만</b> 뽑을 때는 <b>DAY 고르기</b>를 누르고 날짜를 고른 뒤 <b>고른 날만 열기</b>를 누르세요. 고른 쪽만 담긴 PDF가 열립니다.</li>
      <li>인쇄 설정은 <b>A4 · 실제 크기(100%)</b>로 두세요. 양면 인쇄를 해도 됩니다.</li>
    </ol>
  </div>
</main>
<footer id="foot"></footer>
<div class="toast" id="toast"></div>

    if (k === 'on') for (const [e, f] of Object.entries(v)) n.addEventListener(e, f);
    else if (k === 'class') n.className = v;
    else n.setAttribute(k, v);
  }
  for (const c of kids) n.append(c);
  return n;
};
function toast(msg, ms = 2600) {
  const t = $('#toast'); t.textContent = msg; t.style.display = 'block';
  clearTimeout(toast.h); toast.h = setTimeout(() => (t.style.display = 'none'), ms);
}

function renderLevels() {
  const box = $('#levels'); box.innerHTML = '';
  for (const lv of SITE.levels) {
    box.append(el('button', {
      style: `--c:${COLORS[lv.id]}`, 'aria-pressed': String(lv.id === state.lv),
      on: { click: () => { state.lv = lv.id; state.open = null; state.picked.clear(); store.set('lv', lv.id); render(); } },
    }, lv.name));
  }
  document.documentElement.style.setProperty('--lv', COLORS[state.lv]);
  document.documentElement.style.setProperty('--lv-soft', SOFT[state.lv]);
}

function renderKind() {
  for (const b of document.querySelectorAll('#kind button')) b.setAttribute('aria-pressed', String(b.dataset.k === state.kind));
}

function pickKey(vol, i) { return vol + ':' + i; }

function renderVols() {
  const box = $('#vols'); box.innerHTML = '';
  const lv = SITE.data[state.lv];
  for (const [vol, pair] of Object.entries(lv.vols)) {
    const e = pair[state.kind];
    if (!e) continue;
    const open = state.open === vol;
    const picked = [...state.picked].filter((k) => k.startsWith(vol + ':')).map((k) => +k.split(':')[1]).sort((a, b) => a - b);
    const card = el('div', { class: 'vol' + (open ? ' open' : '') });
    card.append(el('div', { class: 'vol-head' },
      el('span', { class: 't' }, 'Vol ' + vol),
      el('span', { class: 'm' }, `DAY 20개 · ${e.pages}쪽 · ${e.mb}MB`),
      el('button', { class: 'btn ghost', 'aria-expanded': String(open), on: { click: () => { state.open = open ? null : vol; renderVols(); } } }, open ? 'DAY 접기' : 'DAY 고르기'),
      el('a', { class: 'btn primary', href: e.file, target: '_blank', rel: 'noopener' }, '열기'),
    ));
    const days = el('div', { class: 'days' });
    const units = {};
    e.days.forEach((d, i) => (units[d.u] ||= []).push([d, i]));
    for (const [u, list] of Object.entries(units)) {
      const row = el('div', { class: 'unit' }, el('span', { class: 'u' }, 'Unit ' + u));
      for (const [d, i] of list) {
        const on = state.picked.has(pickKey(vol, i));
        const pages = d.from === d.to ? `${d.from}쪽` : `${d.from}–${d.to}쪽`;
        row.append(el('button', {
          class: 'day', 'aria-pressed': String(on),
          on: { click: () => { const k = pickKey(vol, i); on ? state.picked.delete(k) : state.picked.add(k); renderVols(); } },
        }, 'Day ' + d.d, el('small', {}, pages)));
      }
      days.append(row);
    }
    const count = picked.reduce((n, i) => n + (e.days[i].to - e.days[i].from + 1), 0);
    const go = el('button', { class: 'btn primary', on: { click: () => openPicked(vol, e, picked) } },
      picked.length ? `고른 날만 열기 (${picked.length}일 · ${count}쪽)` : '고른 날만 열기');
    if (!picked.length) go.disabled = true;
    days.append(el('div', { class: 'bar' },
      el('span', { class: 'hint' }, picked.length ? '고른 날만 담은 PDF가 새 탭에 열립니다.' : '뽑을 DAY를 눌러 고르세요. 여러 날을 골라도 됩니다.'),
      el('button', { class: 'btn ghost', on: { click: () => { e.days.forEach((_, i) => state.picked.delete(pickKey(vol, i))); renderVols(); } } }, '고른 것 지우기'),
      go,
    ));
    card.append(days);
    box.append(card);
  }
}

function renderAll() {
  const lv = SITE.data[state.lv];
  const e = lv.all[state.kind];
  const box = $('#all'); box.innerHTML = '';
  if (!e) return;
  box.append(
    el('span', { class: 'm' }, `${state.lv} 여섯 권 전체 한 파일 · ${e.pages}쪽 · ${e.mb}MB`),
    el('a', { class: 'btn ghost', href: e.file, target: '_blank', rel: 'noopener' }, '전체 열기'),
  );
}

const cache = new Map();
async function openPicked(vol, e, picked) {
  // 팝업 차단을 피하려고 클릭하자마자 창부터 엽니다.
  const win = window.open('', '_blank');
  if (win) win.document.write('<p style="font:16px sans-serif;padding:24px">PDF를 만드는 중입니다…</p>');
  try {
    toast('고른 날의 쪽을 모으는 중입니다…', 8000);
    if (!cache.has(e.file)) cache.set(e.file, fetch(e.file).then((r) => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); }));
    const src = await PDFLib.PDFDocument.load(await cache.get(e.file));
    const out = await PDFLib.PDFDocument.create();
    const idx = [];
    for (const i of picked) for (let p = e.days[i].from; p <= e.days[i].to; p++) idx.push(p - 1);
    for (const pg of await out.copyPages(src, idx)) out.addPage(pg);
    const names = picked.map((i) => `U${e.days[i].u}D${e.days[i].d}`).join('_');
    out.setTitle(`${state.lv} Vol${vol} ${names}`);
    const url = URL.createObjectURL(new Blob([await out.save()], { type: 'application/pdf' }));
    if (win) win.location.href = url; else window.location.href = url;
    toast('새 탭에 열었습니다. 거기서 인쇄하세요.');
  } catch (err) {
    if (win) win.close();
    toast('PDF를 만들지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요.', 5000);
  }
}

function render() { renderLevels(); renderKind(); renderVols(); renderAll(); }

for (const b of document.querySelectorAll('#kind button')) {
  b.addEventListener('click', () => { state.kind = b.dataset.k; store.set('kind', state.kind); render(); });
}
$('#foot').textContent = `자료 기준일 ${SITE.stamp}`;
render();
</script>
</body>
</html>
