<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0b3a73">
<title>웨일리 아케이드</title>
<link rel="icon" href="../voca/icons/favicon-32.png">
<link rel="apple-touch-icon" href="../voca/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
:root{--navy:#0b3a73;--blue:#2f8cf0;--sky:#bfe6ff;--gold:#ffc83d;--pink:#ff7aa8;--mint:#3ed6a0;--red:#ff5a5f;--ink:#1d2a44;--card:#ffffff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:#0b3a73;font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;font-weight:700;letter-spacing:-.01em;color:var(--ink);overflow:hidden;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;border:0}
#app{position:fixed;inset:0;max-width:560px;margin:0 auto;overflow:hidden;background:#bfe6ff url(img/bgSea.jpg) center/cover}
.glass{background:rgba(255,255,255,.68);backdrop-filter:blur(16px) saturate(1.3);-webkit-backdrop-filter:blur(16px) saturate(1.3);border:1px solid rgba(255,255,255,.75);box-shadow:0 10px 30px rgba(20,70,130,.16)}
.screen{position:absolute;inset:0;display:none;flex-direction:column}
.screen.on{display:flex}
/* 홈 */
#home{align-items:center;padding:calc(18px + env(safe-area-inset-top)) 16px 16px;overflow-y:auto}
.logo{font-size:30px;font-weight:900;color:var(--navy);margin:4px 0 0;letter-spacing:-.03em;text-shadow:0 2px 12px rgba(255,255,255,.9)}
.logo b{background:linear-gradient(90deg,#ff9a3c,#ff5f7e);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:14px;font-weight:600;color:#2c4f7c;margin:4px 0 6px}
#mascot{width:100%;max-width:400px;height:auto;aspect-ratio:720/340}
.lvrow{display:flex;gap:10px;width:100%;margin:6px 0}
.lvbtn{flex:1;padding:13px 6px;border-radius:18px;font-size:18px;font-weight:800;background:rgba(255,255,255,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);color:var(--navy);border:1px solid rgba(255,255,255,.8);box-shadow:0 8px 20px rgba(20,70,130,.14);transition:transform .15s}
.lvbtn.on{background:linear-gradient(135deg,#1456a0,#0b3a73);color:#fff;border-color:transparent;box-shadow:0 10px 24px rgba(11,58,115,.35)}
.pick{display:flex;gap:8px;width:100%;margin:6px 0}
.pick select{flex:1;min-width:0;font-family:inherit;font-weight:700;font-size:16px;padding:11px 8px;border-radius:14px;border:1px solid rgba(255,255,255,.85);background:rgba(255,255,255,.75);backdrop-filter:blur(12px);color:var(--ink);box-shadow:0 6px 16px rgba(20,70,130,.1)}
.games{display:grid;gap:12px;width:100%;margin-top:10px}
.gcard{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:24px;color:#fff;text-align:left;box-shadow:0 14px 30px rgba(20,50,110,.22),inset 0 1px 0 rgba(255,255,255,.35);position:relative;overflow:visible;transition:transform .15s}
.gcard .ic img{width:70px;height:74px;object-fit:contain;filter:drop-shadow(0 6px 8px rgba(0,0,0,.2))}
.gcard .ic{width:66px;height:62px;display:flex;align-items:flex-end;justify-content:center;flex:none;margin-top:-18px}
.gcard h3{margin:0;font-size:20px;font-weight:900;letter-spacing:-.02em}
.gcard p{margin:3px 0 0;font-size:13px;font-weight:500;opacity:.92}
.gcard .best{position:absolute;right:12px;top:10px;font-size:12px;font-weight:800;background:rgba(255,255,255,.25);padding:3px 9px;border-radius:10px}
.g1{background:linear-gradient(135deg,#ffb35c,#ff6f8e)}
.g2{background:linear-gradient(135deg,#3cc6f7,#4a7cf2)}
.g3{background:linear-gradient(135deg,#ff8a5c,#8a54e8)}
.gcard:active,.lvbtn:active,.choice:active,.pbtn:active,.fr:active{transform:scale(.97)}
.friends{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;width:100%;margin:2px 0 4px}
.fr{background:rgba(255,255,255,.7);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.85);border-radius:16px;padding:6px 2px 5px;text-align:center;font-size:12px;font-weight:800;color:var(--navy);box-shadow:0 6px 16px rgba(20,70,130,.12);position:relative;line-height:1.1;transition:transform .15s}
.fr img{width:100%;height:44px;object-fit:contain;display:block;margin-bottom:2px}
.fr.on{background:#fff;box-shadow:0 0 0 3px #ffc83d,0 8px 18px rgba(255,170,30,.3)}
.fr.lock img{filter:grayscale(1) brightness(.75);opacity:.55}
.fr .lk{position:absolute;left:50%;top:14px;transform:translateX(-50%);font-size:10.5px;color:#fff;background:rgba(20,40,80,.72);border-radius:9px;padding:1px 6px;white-space:nowrap;font-family:system-ui,sans-serif}
.starbar{font-size:13px;font-weight:700;color:#2c4f7c;margin:4px 0 2px;background:rgba(255,255,255,.6);padding:4px 12px;border-radius:999px}
.unlock{font-size:15px;font-weight:800;color:#fff;background:linear-gradient(135deg,#3cc6f7,#4a7cf2);padding:6px 14px 6px 8px;border-radius:16px;margin-top:10px;display:flex;align-items:center;gap:8px;box-shadow:0 10px 24px rgba(60,120,240,.3)}
.unlock img{width:40px;height:40px;object-fit:contain}
.foot{font-size:12px;font-weight:600;color:#3d5f88;margin-top:14px;text-align:center}
/* 게임 */
#game{background:#000}
#cv{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 10px 0;display:flex;align-items:center;gap:8px;pointer-events:none;z-index:3}
.hud .pill{white-space:nowrap;background:rgba(255,255,255,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.8);border-radius:16px;padding:5px 11px;font-size:16px;font-weight:800;color:var(--navy);box-shadow:0 6px 14px rgba(0,30,70,.12)}
.hud .x{pointer-events:auto;background:rgba(255,255,255,.72);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.8);border-radius:14px;width:38px;height:36px;font-size:17px;font-weight:800;color:var(--navy)}
.hud .sp{flex:1}
#energy{position:absolute;left:12px;right:12px;top:calc(52px + env(safe-area-inset-top));height:12px;border-radius:8px;background:rgba(0,0,0,.25);overflow:hidden;z-index:3;display:none}
#energy i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#ff5a5f,#ffc83d,#3ed6a0);border-radius:8px;transition:width .1s linear}
#prompt{position:absolute;left:50%;top:calc(74px + env(safe-area-inset-top));transform:translateX(-50%);z-index:3;background:rgba(255,255,255,.82);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid rgba(255,255,255,.9);border-radius:22px;padding:9px 20px;font-size:24px;font-weight:900;letter-spacing:-.02em;color:var(--navy);box-shadow:0 12px 30px rgba(0,30,70,.18);max-width:92%;text-align:center;line-height:1.25;pointer-events:none}
#prompt small{display:block;font-size:12px;font-weight:600;color:#6c84a6;margin-top:2px}
#built{position:absolute;left:12px;right:12px;top:calc(150px + env(safe-area-inset-top));z-index:3;text-align:center;color:#fff;font-size:19px;font-weight:800;text-shadow:0 2px 10px rgba(0,0,0,.45);pointer-events:none;min-height:24px}
#built span{color:var(--gold)}
#ctrl{position:absolute;left:0;right:0;bottom:0;padding:10px 10px calc(14px + env(safe-area-inset-bottom));display:flex;gap:10px;z-index:3}
.choice{flex:1;min-width:0;min-height:76px;border-radius:22px;font-size:24px;font-weight:800;letter-spacing:-.01em;word-break:keep-all;overflow-wrap:anywhere;background:rgba(255,255,255,.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.95);color:var(--navy);box-shadow:0 12px 26px rgba(0,30,70,.18);padding:6px;line-height:1.1;transition:transform .12s,background .15s}
.choice.ok{background:linear-gradient(135deg,#4fe0ad,#22c08a);color:#fff;border-color:transparent;box-shadow:0 12px 26px rgba(34,192,138,.35)}
.choice.bad{background:linear-gradient(135deg,#ff7a7e,#f2475b);color:#fff;border-color:transparent;box-shadow:0 12px 26px rgba(242,71,91,.35);animation:shake .3s}
.choice .arr{display:block;font-size:12px;font-weight:700;opacity:.5;margin-bottom:2px}
.pbtn{width:84px;min-height:76px;border-radius:22px;font-size:28px;background:rgba(255,255,255,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.9);color:var(--navy);box-shadow:0 12px 26px rgba(0,30,70,.2)}
#runhint{flex:1;align-self:center;color:#fff;text-align:center;font-size:14px;font-weight:700;text-shadow:0 2px 8px rgba(0,0,0,.4)}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#toast{position:absolute;left:50%;top:42%;transform:translate(-50%,-50%) scale(.6);z-index:6;font-size:36px;font-weight:900;color:#fff;text-shadow:0 4px 18px rgba(0,0,0,.35),0 0 24px rgba(255,200,61,.8);opacity:0;pointer-events:none;transition:.25s;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
#ready{position:absolute;inset:0;z-index:7;display:none;align-items:center;justify-content:center;flex-direction:column;background:rgba(5,25,55,.35);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:var(--navy);text-align:center;padding:24px}
#ready .rc{background:rgba(255,255,255,.88);border:1px solid #fff;border-radius:30px;padding:22px 22px 24px;max-width:340px;box-shadow:0 24px 60px rgba(0,20,60,.35);display:flex;flex-direction:column;align-items:center}
#ready .rc img{width:110px;height:110px;object-fit:contain;margin-top:-70px;filter:drop-shadow(0 10px 14px rgba(0,0,0,.2))}
#ready.on{display:flex}
#ready h2{font-size:28px;margin:4px 0 8px;font-weight:900;letter-spacing:-.02em}
#ready p{font-size:15px;font-weight:500;color:#40597d;margin:0 0 18px;line-height:1.55}
.big{font-size:20px;font-weight:900;padding:14px 44px;border-radius:999px;background:linear-gradient(180deg,#ffd76a,#ffb627);color:#5a3500;box-shadow:0 12px 26px rgba(255,170,30,.4),inset 0 -3px 0 rgba(0,0,0,.08)}
/* 결과 */
#result{align-items:center;justify-content:flex-start;padding:calc(26px + env(safe-area-inset-top)) 18px 18px;overflow-y:auto;background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,.55)),url(img/bgSky.jpg) center/cover}
#result h2{font-size:28px;color:var(--navy);margin:6px 0 0;font-weight:900;letter-spacing:-.02em}
.stars{font-size:46px;letter-spacing:6px;margin:4px 0}
.stars .off{filter:grayscale(1);opacity:.3}
.score{font-size:17px;font-weight:800;color:#2c4f7c;background:rgba(255,255,255,.7);padding:5px 14px;border-radius:999px}
.newbest{font-size:14px;font-weight:800;color:#fff;background:linear-gradient(135deg,#ff8ab4,#ff5f7e);padding:4px 14px;border-radius:999px;margin-top:8px}
.wrongbox{width:100%;background:rgba(255,255,255,.8);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #fff;border-radius:22px;padding:12px 16px;margin-top:14px;box-shadow:0 12px 30px rgba(20,70,130,.15)}
.wrongbox h4{margin:0 0 6px;font-weight:900;color:var(--navy);font-size:16px}
.wrow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid rgba(11,58,115,.08);font-size:16px}
.wrow:first-of-type{border-top:0}
.wrow b{font-weight:800;color:var(--navy)}
.wrow span{flex:1;color:#6c84a6;font-weight:500;font-size:13px}
.wrow button{background:#e8f4ff;border-radius:10px;padding:5px 9px;font-size:16px}
.rbtns{display:flex;gap:10px;width:100%;margin-top:16px}
.rbtns button{flex:1;font-size:17px;font-weight:800;padding:14px;border-radius:18px;background:rgba(255,255,255,.85);border:1px solid #fff;color:var(--navy);box-shadow:0 10px 24px rgba(20,70,130,.15)}
.rbtns .again{background:linear-gradient(135deg,#1456a0,#0b3a73);color:#fff;border-color:transparent;box-shadow:0 12px 26px rgba(11,58,115,.35)}
.rk{width:100%;margin-top:14px;background:rgba(255,255,255,.82);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #fff;border-radius:22px;padding:12px 14px;box-shadow:0 12px 30px rgba(20,70,130,.15);color:#0b3a73;text-align:left;font-family:'Pretendard',system-ui,sans-serif}
.rk-load{font-size:14px;font-weight:700;text-align:center;color:#5a7aa3;padding:6px}
.rk-team{font-size:13.5px;font-weight:700;background:linear-gradient(135deg,#e6f6ff,#fff3d6);border-radius:14px;padding:9px 12px;margin-bottom:10px;line-height:1.4}
.rk-team b{white-space:nowrap;font-size:17px;font-weight:900;color:#ff7a2f}
.rk-h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:6px}
.rk-h>span{font-size:16px;font-weight:900}
.rk-tabs{display:flex;background:rgba(11,58,115,.08);border-radius:999px;padding:3px}
.rk-tabs button{font:inherit;font-size:12.5px;font-weight:800;border:0;background:none;color:#5a7aa3;padding:5px 10px;border-radius:999px;cursor:pointer}
.rk-tabs button.on{background:#fff;color:#0b3a73;box-shadow:0 2px 6px rgba(0,30,70,.12)}
.rk-row{display:flex;align-items:center;gap:10px;padding:7px 4px;border-top:1px solid rgba(11,58,115,.07);font-size:15px}
.rk-row:first-child{border-top:0}
.rk-row.me{background:#fff6d6;border-radius:12px;padding:7px 8px}
.rk-n{width:26px;text-align:center;font-weight:900;font-size:16px}
.rk-row b{flex:1;font-weight:800}
.rk-row b i{font-style:normal;font-size:11px;background:#ffc83d;color:#5a3500;border-radius:6px;padding:1px 6px;margin-left:4px;vertical-align:2px}
.rk-s{font-weight:900;color:#1456a0}
.rk-my{font-size:13px;font-weight:700;color:#5a7aa3;text-align:right;margin-top:4px}
.rk-my b{color:#ff7a2f}
.rk-note{font-size:12px;font-weight:500;color:#6c84a6;margin-top:6px;text-align:center}
.rk-empty{font-size:13.5px;font-weight:600;color:#6c84a6;text-align:center;padding:10px 4px}
</style>
</head>
<body>
<div id="app">
  <!-- 홈 -->
  <section id="home" class="screen on">
    <div class="logo">웨일리 <b>아케이드</b></div>
    <div class="sub">바다 친구들과 단어로 달리고, 오르고, 점프하자!</div>
    <canvas id="mascot" width="720" height="340"></canvas>
    <div class="starbar" id="starbar"></div>
    <div class="friends" id="friends"></div>
    <div class="lvrow">
      <button class="lvbtn" data-lv="lv520">Level 520</button>
      <button class="lvbtn" data-lv="lv860">Level 860</button>
    </div>
    <div class="pick">
      <select id="selVol" aria-label="권"></select>
      <select id="selUnit" aria-label="유닛"></select>
      <select id="selDay" aria-label="데이"></select>
    </div>
    <div class="games">
      <button class="gcard g1" data-game="stairs"><span class="ic"><img src="img/whale_happy.webp" alt=""></span><span><h3>무한 계단</h3><p>뜻에 맞는 단어 쪽으로 한 칸씩! 멈추면 떨어져요</p></span><span class="best" id="best-stairs"></span></button>
      <button class="gcard g2" data-game="run"><span class="ic"><img src="img/whale_swim.webp" alt=""></span><span><h3>웨일리 런</h3><p>바다를 달리며 정답 문으로 쏙! 별 젤리도 냠냠</p></span><span class="best" id="best-run"></span></button>
      <button class="gcard g3" data-game="obby"><span class="ic"><img src="img/turtle.webp" alt=""></span><span><h3>문장 오비</h3><p>단어 발판을 순서대로 밟고 용암을 건너요</p></span><span class="best" id="best-obby"></span></button>
    </div>
    <div class="foot">소리를 켜면 영어 발음이 나와요 🔊</div>
  </section>

  <!-- 게임 -->
  <section id="game" class="screen">
    <canvas id="cv"></canvas>
    <div class="hud">
      <button class="x" id="quit" aria-label="나가기">✕</button>
      <button class="x" id="mus" aria-label="배경음악 켜고 끄기">🎵</button>
      <span class="pill" id="hearts" style="font-size:14px;letter-spacing:-2px">❤️❤️❤️</span>
      <span class="sp"></span>
      <span class="pill" id="combo" style="display:none"></span>
      <span class="pill" id="score">0</span>
    </div>
    <div id="energy"><i></i></div>
    <div id="prompt"></div>
    <div id="built"></div>
    <div id="ctrl"></div>
    <div id="toast"></div>
    <div id="ready"><div class="rc"><img id="rImg" alt=""><h2 id="rTitle"></h2><p id="rDesc"></p><button class="big" id="go">시작!</button></div></div>
  </section>

  <!-- 결과 -->
  <section id="result" class="screen">
    <canvas id="mascot2" width="400" height="300" style="width:200px;height:150px"></canvas>
    <h2 id="resTitle"></h2>
    <div class="stars" id="resStars"></div>
    <div class="score" id="resScore"></div>
    <div id="resUnlock"></div>
    <div id="resBest"></div>
    <div id="resRank" style="width:100%"></div>
    <div class="wrongbox" id="resWrong"></div>
    <div class="rbtns"><button id="toHome">🏠 처음으로</button><button class="again" id="again">🔁 한 번 더</button></div>
  </section>
</div>

<script src="data.js"></script>
<script src="audio.js"></script>
<script src="sound.js"></script>
<script>
'use strict';
/* ───────── 기본 도구 ───────── */
const $ = (q) => document.querySelector(q);
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const store = {
  get(k, d) { try { const v = localStorage.getItem('whaley-arcade:' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('whaley-arcade:' + k, JSON.stringify(v)); } catch (e) {} }
};

/* ───────── 소리: 효과음은 직접 합성, 영어는 기기 음성 ───────── */
const SFX = Object.assign({ unlock: WSOUND.ctx }, WSOUND.sfx); // 소리는 sound.js (배경음악 + 효과음)
const VOICE = (() => {
  // 1순위: 교재 원어민 녹음(데일리 듣기 음원에서 자른 조각) · 없으면 기기에서 가장 자연스러운 영어 음성
  let v = null;
  const GOOD = /natural|neural|enhanced|premium|siri|samantha|ava|allison|aria|jenny|google us english|zira/i;
  const load = () => { const vs = ((window.speechSynthesis && speechSynthesis.getVoices()) || []).filter((x) => /^en[-_]?(US|GB)?/i.test(x.lang)); v = vs.find((x) => /en[-_]US/i.test(x.lang) && GOOD.test(x.name)) || vs.find((x) => /en[-_]US/i.test(x.lang)) || vs[0] || null; };
  if (window.speechSynthesis) { load(); speechSynthesis.onvoiceschanged = load; }
  const AUD = window.ARCADE_AUD || {}, au = new Audio(); au.preload = 'auto';
  function tts(text, rate) {
    if (!window.speechSynthesis) return;
    try { speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = 'en-US'; if (v) u.voice = v; u.rate = rate || .9; speechSynthesis.speak(u); } catch (e) {}
  }
  return {
    say(text, rate) {
      if (!text) return;
      const k = AUD[text];
      WSOUND.music.duck(text.length > 14 ? 2300 : 1200);
      if (k) { try { speechSynthesis.cancel(); } catch (e) {} au.pause(); au.src = 'audio/' + k + '.mp3'; au.playbackRate = 1; au.play().catch(() => tts(text, rate)); return; }
      tts(text, rate);
    },
    prime() { try { au.muted = true; au.play().catch(() => {}); au.pause(); au.muted = false; } catch (e) {} }

    if (g.falling) { g.fallV += 900 * dt; g.fallY += g.fallV * dt; }
    const cur = g.stairs[g.i]; g.camY = lerp(g.camY, cur.y, Math.min(1, dt * 6));
  };
  g.draw = (c) => {
    // 하늘: 높이에 따라 낮 → 노을 → 우주
    const h = clamp(g.score / 80, 0, 1);
    const top = h < .5 ? mix('#7cc8ff', '#ff9a8a', h * 2) : mix('#ff9a8a', '#1b1550', (h - .5) * 2);
    const bot = h < .5 ? mix('#dff3ff', '#ffd59a', h * 2) : mix('#ffd59a', '#3a2a7a', (h - .5) * 2);
    const gr = c.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, top); gr.addColorStop(1, bot); c.fillStyle = gr; c.fillRect(0, 0, W, H);
    if (drawBg(c, 'bgSky', 0, -g.camY * .04 + 40, 1.15)) { c.globalAlpha = h * .75; c.fillStyle = gr; c.fillRect(0, 0, W, H); c.globalAlpha = 1; }
    if (h > .55) { c.fillStyle = 'rgba(255,255,255,' + (h - .55) * 2 + ')'; for (let i = 0; i < 40; i++) { const sx = (i * 97) % W, sy = (i * 151 + g.camY * .05) % H; c.fillRect(sx, (sy + H) % H, 2, 2); } }
    // 구름 (패럴랙스)
    c.fillStyle = 'rgba(255,255,255,.45)';
    for (let i = 0; i < 4; i++) { const cy0 = ((i * 170 - g.camY * .35) % (H + 200) + H + 200) % (H + 200) - 100; cloud(c, (i * 131 + 40) % W, cy0, 1 + (i % 3) * .3); }
    c.save();
    const sx = g.shake > 0 ? Math.sin(g.t * 80) * 6 * g.shake : 0;
    const ox = W / 2 - g.stairs[g.i].x * .6 + sx, oy = H * .62 - g.camY;
    c.translate(ox, oy);
    // 계단
    for (let k = Math.max(0, g.i - 8); k < g.stairs.length; k++) {
      const s = g.stairs[k], hue = s.hue || 200;
      c.fillStyle = 'rgba(0,0,0,.12)'; rr(c, s.x - 30, s.y + 6, 60, 20, 8); c.fill();
      c.fillStyle = `hsl(${hue} 80% 62%)`; rr(c, s.x - 30, s.y - 2, 60, 20, 8); c.fill();
      c.fillStyle = `hsl(${hue} 90% 78%)`; rr(c, s.x - 30, s.y - 2, 60, 8, 6); c.fill();
      if (k > 0 && k % 10 === 0) { c.fillStyle = '#fff'; c.font = '800 13px Pretendard, sans-serif'; c.textAlign = 'center'; c.fillText(k + '층', s.x, s.y + 14); }
    }
    for (let k = 10; k < g.stairs.length; k += 10) { // 10층마다 바다 친구가 기다려요
      const s = g.stairs[k], fk = otherChars()[(k / 10 - 1) % 5], side = (k / 10) % 2 ? 1 : -1;
      drawChar(c, s.x + side * 50, s.y - 2 - Math.abs(Math.sin(g.t * 3 + k)) * 6, 40, { k: fk, t: g.t + k, mood: g.i >= k ? 'happy' : 'idle' });
    }
    // 웨일리
    const cur = g.stairs[g.i], e = easeOut(g.hop);
    const px = lerp(g.from.x, cur.x, e), py = lerp(g.from.y, cur.y, e) - Math.sin(e * Math.PI) * 30 + g.fallY;
    c.fillStyle = 'rgba(0,0,0,.18)'; c.beginPath(); c.ellipse(cur.x, cur.y + 1, 22, 5, 0, 0, Math.PI * 2); c.fill();
    drawChar(c, px, py, 64, { t: g.t, mood: g.over ? 'fall' : g.mood, squash: g.hop < 1 ? (g.hop < .5 ? -.4 : .3) : Math.sin(g.t * 5) * .08, flip: g.dir < 0, rot: g.falling ? g.t * 6 : 0 });
    drawParts(c);
    c.restore();
  };
  return g;
}

/* ═══════════ 게임 2: 웨일리 런 (쿠키런식 레인 러너) ═══════════ */
function RunGame() {
  const P = poolWords(); let queue = [];
  const nextWord = () => { if (!queue.length) queue = shuffle(P.words); return queue.pop(); };
  const GOAL = 20;
  const g = { name: 'run', score: 0, hearts: 3, maxH: 3, combo: 0, wrong: [], correct: 0, tries: 0, over: false, t: 0,
    lane: 1, ly: 1, speed: 190, dist: 0, gates: [], jellies: [], passed: 0, mood: 'idle', moodT: 0, shake: 0, nextGate: 340, spout: 0 };
  const laneY = (l) => H * .42 + l * H * .16;
  function spawnGate() {
    const q = nextWord(); const opts = shuffle([q.en, ...distractorFor(q.en, P.distract, 2)]);
    g.gates.push({ x: W + 60, q, opts, ans: opts.indexOf(q.en), done: false, res: null });
    // 문 사이 젤리
    for (let k = 1; k <= 5; k++) g.jellies.push({ x: W + 60 + k * 70, lane: Math.floor(Math.random() * 3), got: false, bob: Math.random() * 6 });
  }
  function setPrompt() {
    const n = g.gates.find((x) => !x.done);
    UI.prompt(n ? `${shortKo(n.q.ko)}<small>정답 문 줄로 이동! ${g.passed}/${GOAL}</small>` : `<small>준비…</small>`);
  }
  g.start = () => {
    UI.hearts(g.hearts, g.maxH); UI.energy(null);
    $('#ctrl').innerHTML = `<button class="pbtn" id="up">▲</button><div id="runhint">위·아래로 밀거나<br>버튼을 눌러 줄을 바꿔요</div><button class="pbtn" id="dn">▼</button>`;
    $('#up').onpointerdown = (e) => { e.preventDefault(); move(-1); };
    $('#dn').onpointerdown = (e) => { e.preventDefault(); move(1); };
    spawnGate(); setPrompt();
  };
  function move(d) { if (g.over) return; const n = clamp(g.lane + d, 0, 2); if (n !== g.lane) { g.lane = n; SFX.jump(); } }
  g.move = move;
  g.tap = (x, y) => { move(y < laneY(g.lane) ? -1 : 1); };
  g.update = (dt) => {
    g.t += dt; g.moodT -= dt; if (g.moodT <= 0) g.mood = 'idle'; g.shake = Math.max(0, g.shake - dt); g.spout = Math.max(0, g.spout - dt * 1.5);
    g.ly = lerp(g.ly, g.lane, Math.min(1, dt * 14));
    if (g.over) return;
    g.speed = Math.min(380, 190 + g.passed * 9); const dx = g.speed * dt; g.dist += dx;
    const px = W * .2;
    g.gates.forEach((gt) => {
      gt.x -= dx;
      if (!gt.done && gt.x < px + 6) {
        gt.done = true; g.tries++;
        if (g.lane === gt.ans) { gt.res = 'ok'; g.correct++; g.combo++; g.passed++; g.score += 10 + Math.min(g.combo, 10); g.mood = 'happy'; g.moodT = .7; g.spout = 1; SFX.ok(); VOICE.say(gt.q.en, 1); burst(px + 30, laneY(g.lane) - 30, 14, CONF); if (g.combo % 5 === 0) UI.toast('🔥 ' + g.combo + ' 콤보!'); }
        else { gt.res = 'bad'; g.combo = 0; g.hearts--; g.mood = 'sad'; g.moodT = .9; g.shake = .4; SFX.bad(); VOICE.say(gt.q.en, .85); if (!g.wrong.find((w) => w.en === gt.q.en)) g.wrong.push(gt.q); UI.hearts(g.hearts, g.maxH); }
        UI.score(g.score); UI.combo(g.combo);
        if (g.hearts <= 0) { g.over = true; SFX.fall(); setTimeout(() => endGame(g), 1100); }
        else if (g.passed >= GOAL) { g.over = true; g.cleared = true; SFX.win(); burst(W / 2, H / 2, 60, CONF, 420); UI.toast('🏁 골인!'); setTimeout(() => endGame(g), 1500); }
        setTimeout(setPrompt, 250);
      }
    });
    g.gates = g.gates.filter((x) => x.x > -120);
    const last = g.gates[g.gates.length - 1];
    if (!g.over && (!last || last.x < W - Math.max(W * .95, 420))) { spawnGate(); setPrompt(); }
    g.jellies.forEach((j) => { j.x -= dx; if (!j.got && Math.abs(j.x - px - 20) < 22 && j.lane === g.lane) { j.got = true; g.score += 1; UI.score(g.score); SFX.coin(); burst(j.x, laneY(j.lane) - 30, 5, ['#ffc83d', '#fff1b3'], 120); } });
    g.jellies = g.jellies.filter((j) => j.x > -30 && !j.got);
    updParts(dt);
  };
  g.draw = (c) => {
    // 하늘 + 바다
    let gr = c.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#7fd8ff'); gr.addColorStop(1, '#1f7fd0'); c.fillStyle = gr; c.fillRect(0, 0, W, H);
    drawBg(c, 'bgSea', g.dist * .12, 0, 1.05);
    // 빛줄기
    c.save(); c.globalCompositeOperation = 'lighter'; for (let i = 0; i < 4; i++) { const bx = ((i * 170 - g.dist * .05) % (W + 200) + W + 200) % (W + 200) - 100; const lg = c.createLinearGradient(0, 0, 0, H * .7); lg.addColorStop(0, 'rgba(255,255,255,.13)'); lg.addColorStop(1, 'rgba(255,255,255,0)'); c.fillStyle = lg; c.beginPath(); c.moveTo(bx, 0); c.lineTo(bx + 50, 0); c.lineTo(bx + 120 + Math.sin(g.t + i) * 10, H * .7); c.lineTo(bx + 40, H * .7); c.fill(); } c.restore();
    // 뒤에서 같이 헤엄치는 친구들
    otherChars().forEach((fk, i) => { const fx = ((i * 330 - g.dist * .45) % (W + 330 * 2) + W + 660) % (W + 660) - 120; c.globalAlpha = .8; drawChar(c, fx, H * .2 + (i % 2) * 34 + Math.sin(g.t * 2 + i) * 5, 34, { k: fk, t: g.t + i, mood: 'swim' }); c.globalAlpha = 1; });
    { const og = c.createLinearGradient(0, laneY(0) - 90, 0, H); og.addColorStop(0, 'rgba(10,60,120,0)'); og.addColorStop(1, 'rgba(10,60,120,.18)'); c.fillStyle = og; c.fillRect(0, laneY(0) - 90, W, H); }
    // 물결 줄
    for (let l = 0; l < 3; l++) {
      const y = laneY(l) + 8; c.strokeStyle = 'rgba(255,255,255,.35)'; c.lineWidth = 3; c.beginPath();
      for (let x = 0; x <= W; x += 12) c.lineTo(x, y + Math.sin((x + g.dist) / 26 + l) * 3); c.stroke();
    }
    // 거품
    c.strokeStyle = 'rgba(255,255,255,.4)'; c.lineWidth = 2; for (let i = 0; i < 14; i++) { const bx = ((i * 83 - g.dist * .6) % W + W) % W, by = H - ((g.t * 30 + i * 61) % (H * .65)); c.beginPath(); c.arc(bx, by, 3 + i % 4, 0, Math.PI * 2); c.stroke(); }
    c.save(); if (g.shake > 0) c.translate(Math.sin(g.t * 70) * 7 * g.shake, 0);
    // 젤리
    g.jellies.forEach((j) => { const y = laneY(j.lane) - 26 + Math.sin(g.t * 5 + j.bob) * 4; c.fillStyle = '#ffc83d'; c.strokeStyle = '#d18f00'; c.lineWidth = 2; star(c, j.x, y, 11, 5); c.fill(); c.stroke(); });
    // 문
    g.gates.forEach((gt) => {
      for (let l = 0; l < 3; l++) {
        const y = laneY(l) - 34, w = Math.min(150, W * .36), h = 46, x = gt.x - w / 2;
        let col = ['#ff9ec4', '#ffd36b', '#9fe6c6'][l];
        if (gt.res) col = l === gt.ans ? '#3ed6a0' : (gt.res === 'bad' && l === g.lane ? '#ff5a5f' : 'rgba(255,255,255,.55)');
        c.fillStyle = 'rgba(0,0,0,.15)'; rr(c, x, y + 5, w, h, 14); c.fill();
        c.fillStyle = col; rr(c, x, y, w, h, 14); c.fill();
        c.strokeStyle = '#fff'; c.lineWidth = 3; rr(c, x, y, w, h, 14); c.stroke();
        c.fillStyle = '#1d2a44'; c.textAlign = 'center'; c.textBaseline = 'middle'; fitText(c, gt.opts[l], w - 14, 22); c.fillText(gt.opts[l], gt.x, y + h / 2 + 1);
      }
      c.fillStyle = 'rgba(255,255,255,.7)'; c.fillRect(gt.x - 3, laneY(0) - 50, 6, 12);
    });
    // 웨일리
    const px = W * .2, py = laneY(0) + g.ly * H * .16;
    c.fillStyle = 'rgba(0,30,80,.25)'; c.beginPath(); c.ellipse(px + 4, py + 6, 26, 5, 0, 0, Math.PI * 2); c.fill();
    drawChar(c, px, py + Math.sin(g.t * 9) * 3, 66, { t: g.t * 1.6, mood: g.mood === 'idle' ? 'swim' : g.mood, squash: Math.sin(g.t * 9) * .1 });
    drawParts(c);
    c.restore();
    c.textBaseline = 'alphabetic';
    // 진행 막대
    c.fillStyle = 'rgba(0,0,0,.2)'; rr(c, 14, H - 150, W - 28, 10, 5); c.fill();
    c.fillStyle = '#ffc83d'; rr(c, 14, H - 150, (W - 28) * (g.passed / GOAL), 10, 5); c.fill();
  };
  return g;
}

/* ═══════════ 게임 3: 문장 오비 (로블록스 장애물 코스식) ═══════════ */
function ObbyGame() {
  const sents = shuffle(poolSents()).slice(0, 5);
  const GAP = 104;
  const g = { name: 'obby', score: 0, hearts: 5, maxH: 5, combo: 0, wrong: [], correct: 0, tries: 0, over: false, t: 0,
    si: 0, k: 0, tokens: [], plats: [], check: 0, pos: 0, from: null, hop: 1, mood: 'idle', moodT: 0, camX: 0, falling: false, fallY: 0, fallV: 0, fx: 0, total: sents.length, lavaT: 0 };
  const tok = (s) => s.split(/\s+/).filter(Boolean);
  const baseY = () => H * .58;
  g.plats.push({ x: 0, y: 0, w: 92, word: 'START', kind: 'check', pop: 1 });
  function newSentence() {
    const s = sents[g.si]; g.tokens = tok(s.en); g.k = 0; g.check = g.plats.length - 1;
    g.plats[g.check].kind = 'check';
    UI.prompt(`${s.ko}<small>문장 ${g.si + 1}/${g.total} · 발판을 순서대로!</small>`); built(); ask();
  }
  function built() { UI.built(g.tokens.slice(0, g.k).map((w) => `<span>${w}</span>`).join(' ') + (g.k < g.tokens.length ? ' <b style="opacity:.6">＿</b>' : '')); }
  function ask() {
    const right = g.tokens[g.k];
    const norm = (w) => w.toLowerCase().replace(/[^a-z']/g, ''), seen = new Set([norm(right)]);
    const pool = shuffle(poolSents().flatMap((s) => tok(s.en))); const near = g.tokens.slice(g.k + 1);
    const cand = [...shuffle(near), ...pool].filter((w) => { const k = norm(w); if (!k || seen.has(k)) return false; seen.add(k); return true; });
    const opts = shuffle([right, ...cand.slice(0, 2)]);
    const fs = (o) => o.length > 11 ? 16 : o.length > 8 ? 19 : 22;
    $('#ctrl').innerHTML = opts.map((o) => `<button class="choice" style="font-size:${fs(o)}px">${o}</button>`).join('');
    $('#ctrl').querySelectorAll('.choice').forEach((b, i) => b.onpointerdown = (e) => { e.preventDefault(); answer(opts[i], b); });
    g.locked = false;
  }
  function answer(w, btn) {
    if (g.locked || g.over) return; g.locked = true; g.tries++;
    const last = g.plats[g.plats.length - 1];
    if (w === g.tokens[g.k]) {
      g.correct++; g.combo++; g.score += 5 + Math.min(g.combo, 5); btn.classList.add('ok'); SFX.jump();
      const done = g.k + 1 === g.tokens.length;
      g.plats.push({ x: last.x + GAP + (done ? 20 : 0), y: last.y + (g.k % 2 ? 26 : -26) * (Math.random() < .5 ? 1 : .6), w: done ? 96 : 84, word: w, kind: done ? 'goal' : 'plat', pop: 0 });
      g.from = { x: last.x, y: last.y }; g.pos = g.plats.length - 1; g.hop = 0; g.mood = 'happy'; g.moodT = .5;
      g.k++; built(); UI.score(g.score); UI.combo(g.combo);
      if (done) {
        setTimeout(() => { SFX.win(); VOICE.say(sents[g.si].en, .9); const p = g.plats[g.pos]; burst(p.x, p.y - 40, 40, CONF, 380); UI.toast('🚩 체크포인트!'); g.score += 20; UI.score(g.score); }, 380);
        g.si++;
        setTimeout(() => { if (g.si >= g.total) { g.over = true; g.cleared = true; endGame(g); } else newSentence(); }, 1700);
      } else setTimeout(ask, 260);
    } else {
      btn.classList.add('bad'); g.combo = 0; UI.combo(0); SFX.bad();
      const s = sents[g.si]; if (!g.wrong.find((x) => x.en === s.en)) g.wrong.push(s);
      // 없는 발판으로 점프 → 용암 풍덩
      g.from = { x: last.x, y: last.y }; g.fx = last.x + GAP; g.falling = true; g.fallY = 0; g.fallV = -330; g.hop = 0; g.mood = 'fall';
      setTimeout(() => SFX.splash(), 550);
      g.hearts--; UI.hearts(g.hearts, g.maxH);
      setTimeout(() => {
        g.falling = false;
        if (g.hearts <= 0) { g.over = true; endGame(g); return; }
        // 체크포인트로 되돌아가기: 이번 문장 발판은 사라짐
        g.plats.length = g.check + 1; g.pos = g.check; g.k = 0; g.hop = 1; g.mood = 'idle'; UI.toast('↩️ 체크포인트부터!'); built(); ask();
      }, 1300);
    }
  }
  g.start = () => { UI.hearts(g.hearts, g.maxH); UI.energy(null); if (!sents.length) { UI.prompt('이 범위에는 문장이 없어요'); return; } newSentence(); };
  g.update = (dt) => {
    g.t += dt; g.hop = Math.min(1, g.hop + dt * 3.2); g.moodT -= dt; if (g.moodT <= 0 && !g.falling) g.mood = 'idle';
    g.plats.forEach((p) => p.pop = Math.min(1, p.pop + dt * 4));
    if (g.falling) { g.fallV += 1100 * dt; g.fallY += g.fallV * dt; }
    const p = g.plats[g.pos]; g.camX = lerp(g.camX, (g.falling ? g.fx : p.x), Math.min(1, dt * 4));
  };
  g.draw = (c) => {
    let gr = c.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#2a1f6b'); gr.addColorStop(.6, '#6a3fb0'); gr.addColorStop(1, '#ff7a4a'); c.fillStyle = gr; c.fillRect(0, 0, W, H);
    if (!drawBg(c, 'bgLava', g.camX * .15, 0, 1.05)) { c.fillStyle = 'rgba(255,255,255,.7)'; for (let i = 0; i < 50; i++) { const sx = ((i * 89 - g.camX * .15) % W + W) % W, sy = (i * 47) % (H * .5); c.fillRect(sx, sy, 2, 2); } }
    c.save();
    const ox = W * .36 - g.camX, oy = baseY();
    c.translate(ox, oy);
    // 발판
    g.plats.forEach((p, idx) => {
      const s = easeOut(p.pop), w = p.w * s, x = p.x - w / 2, y = p.y;
      const col = p.kind === 'check' ? '#3ed6a0' : p.kind === 'goal' ? '#ffc83d' : ['#ff7aa8', '#29b6f6', '#ff9a3c', '#9b5cff'][idx % 4];
      c.fillStyle = 'rgba(0,0,0,.25)'; c.fillRect(x + 4, y + 8, w, 26);
      c.fillStyle = shade(col, -25); c.fillRect(x, y + 10, w, 22);
      c.fillStyle = col; c.fillRect(x, y, w, 12);
      c.fillStyle = 'rgba(255,255,255,.35)'; c.fillRect(x, y, w, 4);
      if (s > .8) { c.fillStyle = '#fff'; c.textAlign = 'center'; c.textBaseline = 'middle'; fitText(c, p.word, w - 8, 16); c.fillText(p.word, p.x, y + 22); }
      if (p.kind === 'goal' && s > .8) drawChar(c, p.x - w / 2 + 22, y, 40, { k: otherChars()[idx % 5], t: g.t + idx, mood: 'happy' });
      if (p.kind !== 'plat') { // 깃발
        c.strokeStyle = '#fff'; c.lineWidth = 3; c.beginPath(); c.moveTo(p.x + w / 2 - 10, y); c.lineTo(p.x + w / 2 - 10, y - 44); c.stroke();
        c.fillStyle = p.kind === 'goal' ? '#ff5a5f' : '#3ed6a0'; c.beginPath(); c.moveTo(p.x + w / 2 - 10, y - 44); c.lineTo(p.x + w / 2 + 14 + Math.sin(g.t * 6) * 3, y - 37); c.lineTo(p.x + w / 2 - 10, y - 30); c.fill();
      }
    });
    // 웨일리
    const cur = g.plats[g.pos], e = easeOut(g.hop);
    let px, py;
    if (g.falling) { px = lerp(g.from.x, g.fx, Math.min(1, g.hop * 1.3)); py = g.from.y + g.fallY; }
    else { px = lerp(g.from ? g.from.x : cur.x, cur.x, e); py = lerp(g.from ? g.from.y : cur.y, cur.y, e) - Math.sin(e * Math.PI) * 50; }
    if (py < H * .42) drawChar(c, px, py, 58, { t: g.t, mood: g.mood, squash: g.hop < 1 ? -.3 : Math.sin(g.t * 5) * .08, rot: g.falling ? g.t * 7 : 0 });
    if (g.falling && py > H * .36 && !g._spl) { g._spl = true; burst(px, H * .4, 26, ['#ff5a2a', '#ffb02e', '#ffe08a'], 300); }
    if (!g.falling) g._spl = false;
    drawParts(c);
    c.restore();
    // 용암
    const ly = H * .98 - 30; c.fillStyle = 'rgba(255,75,31,.85)'; c.beginPath(); c.moveTo(0, H);
    for (let x = 0; x <= W; x += 10) c.lineTo(x, ly + Math.sin(x / 30 + g.t * 3) * 6); c.lineTo(W, H); c.fill();
    c.fillStyle = 'rgba(255,214,90,.6)'; for (let i = 0; i < 8; i++) { const bx = (i * 67 + g.t * 20) % W; c.beginPath(); c.arc(bx, ly + 12 + Math.sin(g.t * 4 + i) * 4, 4, 0, Math.PI * 2); c.fill(); }
    c.textBaseline = 'alphabetic';
  };
  return g;
}

/* 그리기 도우미 */
function cloud(c, x, y, s) { c.beginPath(); c.arc(x, y, 18 * s, 0, Math.PI * 2); c.arc(x + 20 * s, y - 8 * s, 22 * s, 0, Math.PI * 2); c.arc(x + 42 * s, y, 17 * s, 0, Math.PI * 2); c.fill(); }
function easeOut(t) { return 1 - Math.pow(1 - t, 3); }
function hex(h) { h = h.replace('#', ''); return [0, 2, 4].map((i) => parseInt(h.substr(i, 2), 16)); }
function mix(a, b, t) { const A = hex(a), B = hex(b); return `rgb(${A.map((v, i) => Math.round(lerp(v, B[i], t))).join(',')})`; }
function shade(col, p) { const A = hex(col); return `rgb(${A.map((v) => clamp(v + p, 0, 255)).join(',')})`; }

/* ───────── 실행 루프 ───────── */
let G = null, last = 0, running = false, curGame = 'stairs';
const INFO = {
  stairs: ['🪜 무한 계단', '위에 나온 뜻을 보고, 맞는 영어 단어 쪽(왼쪽/오른쪽)을 눌러 한 칸씩 올라가요.<br>시간 막대가 다 줄면 하트가 깎여요. 10콤보마다 피버!'],
  run: ['🐳 웨일리 런', '웨일리가 바다를 달려요. 뜻에 맞는 단어 문이 있는 줄로 옮겨서 통과!<br>별 젤리를 먹으면 점수 UP. 20문 통과하면 골인!'],
  obby: ['🌋 문장 오비', '한국어 문장을 보고 영어 단어 발판을 순서대로 골라 건너요.<br>틀리면 용암에 풍덩, 체크포인트부터 다시! 문장 5개를 건너면 클리어.']
};
function startGame(name) {
  curGame = name; SFX.unlock(); VOICE.prime(); show('game'); resize(); parts = [];
  $('#ctrl').innerHTML = ''; UI.prompt(''); UI.built(''); UI.energy(null); UI.combo(0); UI.score(0);
  G = name === 'stairs' ? StairsGame() : name === 'run' ? RunGame() : ObbyGame();
  UI.hearts(G.hearts, G.maxH);
  $('#rImg').src = 'img/' + curChar + (name === 'run' ? '_swim' : '_happy') + '.webp'; $('#rImg').style.transform = name === 'run' && !SWIM_RIGHT[curChar] ? 'scaleX(-1)' : ''; $('#rTitle').textContent = INFO[name][0]; $('#rDesc').innerHTML = INFO[name][1]; $('#ready').classList.add('on');
  running = true; last = performance.now(); requestAnimationFrame(loop);
}
$('#go').onclick = () => { $('#ready').classList.remove('on'); SFX.unlock(); WSOUND.sfx.resetSteps(); WSOUND.music.play(curGame); G.start(); G.started = true; };
function loop(now) {
  if (!running) return;
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  if (G.started) G.update(dt); else G.t = (G.t || 0) + dt;
  if (G.name === 'stairs' && G.started) WSOUND.music.tempo(1 + Math.min(G.score, 90) / 150); // 높이 오를수록 빨라져요
  if (G.name !== 'run') updParts(dt);
  cx.clearRect(0, 0, W, H); G.draw(cx);
  requestAnimationFrame(loop);
}
// 터치: 러너는 위/아래 밀기·탭으로 줄 바꾸기
let tStart = null;
cv.addEventListener('pointerdown', (e) => { tStart = { x: e.clientX, y: e.clientY, t: performance.now() }; });
cv.addEventListener('pointerup', (e) => {
  if (!G || G.name !== 'run' || !tStart || !G.started) return;
  const dy = e.clientY - tStart.y, r = cv.getBoundingClientRect();
  if (Math.abs(dy) > 24) G.move(dy < 0 ? -1 : 1); else G.tap(e.clientX - r.left, e.clientY - r.top);
  tStart = null;
});
window.addEventListener('keydown', (e) => {
  if (!G || !G.started) return;
  if (G.name === 'run') { if (e.key === 'ArrowUp') G.move(-1); if (e.key === 'ArrowDown') G.move(1); }
  if (G.name === 'stairs') { const b = $('#ctrl').querySelectorAll('.choice'); if (e.key === 'ArrowLeft' && b[0]) b[0].dispatchEvent(new Event('pointerdown')); if (e.key === 'ArrowRight' && b[1]) b[1].dispatchEvent(new Event('pointerdown')); }
});
$('#quit').onclick = () => { running = false; WSOUND.music.stop(); G = null; if (window.speechSynthesis) speechSynthesis.cancel(); show('home'); showBest(); renderFriends(); };

/* ───────── 학원 순위표 (레벨별 오늘 TOP 5 · 이번 달 누적 TOP 5 · 다 함께 쌓은 숫자) ─────────
   웨일리 보카에 로그인한 학생은 기록이 학원 서버에 올라가고, 아니면 순위만 본다. */
const RANK = (() => {
  const API = 'https://hello-world.a28008005.workers.dev/api/game/score';
  const TEAM = { stairs: ['함께 오른 계단', '층'], run: ['함께 통과한 정답 문', '개'], obby: ['함께 건넌 문장', '개'], sea: ['함께 잡은 몬스터', '마리'] };
  const UNIT = { stairs: '층', run: '점', obby: '점', sea: '코인' };
  const esc = (t) => String(t).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const code = () => { try { return localStorage.getItem('swv.code') || ''; } catch (e) { return ''; } };
  function list(rows, unit) {
    if (!rows.length) return '<div class="rk-empty">아직 기록이 없어요. 첫 번째 주인공이 되어 볼까요?</div>';
    return rows.map((r) => `<div class="rk-row${r.me ? ' me' : ''}"><span class="rk-n">${['🥇', '🥈', '🥉'][r.rank - 1] || r.rank}</span><b>${esc(r.name)}${r.me ? ' <i>나</i>' : ''}</b><span class="rk-s">${r.score.toLocaleString()}${unit}</span></div>`).join('');
  }
  async function show(box, game, level, score, amount) {
    if (!box) return;
    const c = code();
    box.innerHTML = '<div class="rk"><div class="rk-load">🏆 우리 학원 순위 불러오는 중…</div></div>';
    let d = null;
    try {
      const res = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(c ? { code: c, game, level, score, amount } : { game, level }) });
      d = await res.json();
    } catch (e) { d = null; }
    if (!d || !d.success) { box.innerHTML = ''; return; }
    const unit = UNIT[game] || '점', tm = TEAM[game] || ['함께 쌓은 기록', ''];
    const lvName = { phonics: '파닉스', lv240: '240', lv520: '520', lv860: '860' }[level] || level;
    const my = (n, total) => n ? `<div class="rk-my">내 순위 <b>${n}등</b> / ${total}명</div>` : '';
    box.innerHTML = `<div class="rk">
      <div class="rk-team">🤝 오늘 우리 학원 친구 ${d.team.friends}명이 ${tm[0]} <b>${d.team.amount.toLocaleString()}${tm[1]}</b></div>
      <div class="rk-h"><span>🏆 ${lvName} 순위</span><div class="rk-tabs"><button class="on" data-t="today">오늘 TOP 5</button><button data-t="month">이번 달 누적</button></div></div>
      <div class="rk-p" data-p="today">${list(d.today, unit)}${my(d.myToday, d.players.today)}</div>
      <div class="rk-p" data-p="month" hidden>${list(d.month, unit)}${my(d.myMonth, d.players.month)}<div class="rk-note">날마다의 최고 기록을 더한 점수예요. 매일 오면 쑥쑥 올라가요!</div></div>
      ${c ? '' : '<div class="rk-note">웨일리 보카에 로그인하고 하면 내 기록도 순위에 올라가요</div>'}
    </div>`;
    box.querySelectorAll('.rk-tabs button').forEach((b) => b.onclick = () => {
      box.querySelectorAll('.rk-tabs button').forEach((x) => x.classList.toggle('on', x === b));
      box.querySelectorAll('.rk-p').forEach((p) => { p.hidden = p.dataset.p !== b.dataset.t; });
    });
  }
  return { show };
})();

const musBtn = () => { $('#mus').textContent = WSOUND.music.isOn() ? '🎵' : '🔇'; };
$('#mus').onclick = () => { WSOUND.music.toggle(); musBtn(); }; musBtn();
/* ───────── 결과 ───────── */
let resultMood = 'happy';
function endGame(g) {
  running = false; WSOUND.music.stop(); if (!g) return;
  const acc = g.tries ? g.correct / g.tries : 0;
  let stars;
  if (g.name === 'stairs') stars = g.score >= 40 ? 3 : g.score >= 20 ? 2 : g.score >= 8 ? 1 : 0;
  else stars = g.cleared ? (acc >= .9 ? 3 : acc >= .7 ? 2 : 1) : (g.score >= 60 ? 1 : 0);
  const key = 'best:' + g.name + ':' + selKey(), prev = store.get(key, 0), isNew = g.score > prev;
  if (isNew) store.set(key, g.score);
  const before = totalStars(), skey = 'stars:' + g.name + ':' + selKey();
  if (stars > store.get(skey, 0)) store.set(skey, stars);
  const after = totalStars(), opened = CHARS.filter((c) => c.need > before && c.need <= after);
  $('#resUnlock').innerHTML = opened.map((c) => `<div class="unlock"><img src="img/${c.k}.webp" alt="">새 친구 ${c.name} 등장! 홈에서 골라 보세요</div>`).join('');
  resultMood = stars >= 2 ? 'happy' : stars === 1 ? 'idle' : 'sad';
  $('#resTitle').textContent = g.cleared ? '클리어! 대단해요 🎉' : stars >= 2 ? '멋져요! 🎉' : stars === 1 ? '잘했어요! 👍' : '다시 도전해 볼까요? 💪';
  $('#resStars').innerHTML = [0, 1, 2].map((i) => `<span class="${i < stars ? '' : 'off'}">⭐</span>`).join('');
  $('#resScore').textContent = (g.name === 'stairs' ? g.score + '층 올라감' : g.score + '점') + ` · 정답률 ${Math.round(acc * 100)}%`;
  $('#resBest').innerHTML = isNew && g.score > 0 ? '<div class="newbest">🏆 새 최고 기록!</div>' : '';
  const wb = $('#resWrong');
  if (g.wrong.length) {
    wb.style.display = '';
    wb.innerHTML = `<h4>다시 볼 ${g.name === 'obby' ? '문장' : '단어'} (${g.wrong.length})</h4>` + g.wrong.map((w, i) => `<div class="wrow"><b>${w.en}</b><span>${w.ko}</span><button data-i="${i}">🔊</button></div>`).join('');
    wb.querySelectorAll('button').forEach((b) => b.onclick = () => VOICE.say(g.wrong[+b.dataset.i].en, .85));
  } else { wb.style.display = ''; wb.innerHTML = '<h4>틀린 것 없이 완벽해요! ✨</h4>'; }
  if (stars >= 2) SFX.win();
  show('result');
  const amount = g.name === 'stairs' ? g.score : g.name === 'run' ? (g.passed || 0) : (g.cleared ? g.total : (g.si || 0));
  RANK.show($('#resRank'), g.name, sel.lv, g.score, amount);
}
$('#again').onclick = () => startGame(curGame);
$('#toHome').onclick = () => { show('home'); showBest(); renderFriends(); };

/* ───────── 홈 ───────── */
function totalStars() { let n = 0; try { for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf('whaley-arcade:stars:') === 0) n += +JSON.parse(localStorage.getItem(k)) || 0; } } catch (e) {} return n; }
function renderFriends() {
  const tot = totalStars();
  if (!CHARS.find((c) => c.k === curChar && c.need <= tot)) curChar = 'whale';
  $('#starbar').textContent = `⭐ 모은 별 ${tot}개 · 같이 놀 친구를 골라요`;
  $('#friends').innerHTML = CHARS.map((c) => { const lock = c.need > tot; return `<button class="fr ${c.k === curChar ? 'on' : ''} ${lock ? 'lock' : ''}" data-k="${c.k}"><img src="img/${c.k}.webp" alt="">${c.name}${lock ? `<span class="lk">🔒 ⭐${c.need}</span>` : ''}</button>`; }).join('');
  $('#friends').querySelectorAll('.fr').forEach((b) => b.onclick = () => {
    const c = CHARS.find((x) => x.k === b.dataset.k);
    if (c.need > totalStars()) { b.animate([{ transform: 'translateX(-4px)' }, { transform: 'translateX(4px)' }, { transform: 'none' }], 250); return; }
    curChar = c.k; store.set('char', curChar); renderFriends();
  });
}
document.querySelectorAll('.lvbtn').forEach((b) => b.onclick = () => { sel.lv = b.dataset.lv; sel.v = null; sel.u = null; sel.d = 'all'; fillSelects(); });
$('#selVol').onchange = (e) => { sel.v = +e.target.value; sel.u = null; sel.d = 'all'; fillSelects(); };
$('#selUnit').onchange = (e) => { sel.u = +e.target.value; sel.d = 'all'; fillSelects(); };
$('#selDay').onchange = (e) => { sel.d = e.target.value === 'all' ? 'all' : +e.target.value; fillSelects(); };
document.querySelectorAll('.gcard').forEach((b) => b.onclick = () => startGame(b.dataset.game));
// 주소로 레벨 지정: ?lv=520 또는 ?lv=860
const qlv = new URLSearchParams(location.search).get('lv'); if (qlv === '520' || qlv === '860') sel.lv = 'lv' + qlv;
fillSelects();
renderFriends();
mascotLoop($('#mascot'));
mascotLoop($('#mascot2'), () => resultMood);
</script>
