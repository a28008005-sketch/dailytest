<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>고래 먼슬리 듣기</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;600;700&family=Gothic+A1:wght@400;500;700&display=swap">
<style>
:root{--paper:#FFF7EE;--card:#FFFFFF;--ink:#16202B;--muted:#7A6A5C;--line:#EADBCB;--orange:#F07B0F;--orange-soft:#FDD9B4;--rust:#94480A;--done:#1E7A54}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--paper);color:var(--ink);font-family:"Gothic A1","Lexend",system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:520px;margin:0 auto;padding:20px 16px calc(32px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.badge{flex:none;width:52px;height:52px;border-radius:14px;background:var(--orange);color:#fff;display:grid;place-items:center;font:700 15px/1 "Lexend",sans-serif;text-align:center}
h1{margin:0;font:700 22px/1.25 "Lexend","Gothic A1",sans-serif}
.sub{margin:3px 0 0;color:var(--muted);font-size:14px}
.tip{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;line-height:1.6;color:var(--muted);margin-bottom:16px}
.tip b{color:var(--ink)}
.track{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px;display:flex;align-items:center;gap:14px}
.track.on{border-color:var(--orange);box-shadow:0 0 0 2px var(--orange-soft)}
.track.done .num{background:var(--done)}
.play{flex:none;width:56px;height:56px;border-radius:50%;border:0;background:var(--orange);color:#fff;font-size:22px;cursor:pointer;display:grid;place-items:center}
.play:active{transform:scale(.96)}
.info{flex:1;min-width:0}
.name{font:600 17px/1.2 "Lexend",sans-serif;display:flex;align-items:center;gap:8px}
.num{display:inline-block;background:var(--rust);color:#fff;border-radius:999px;font-size:12px;padding:2px 8px}
.bar{height:6px;background:var(--orange-soft);border-radius:99px;margin-top:10px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--orange)}
.time{font:400 12px/1 "Lexend",sans-serif;color:var(--muted);margin-top:6px}
.all{width:100%;border:0;border-radius:14px;background:var(--ink);color:#fff;font:600 16px/1 "Gothic A1",sans-serif;padding:16px;margin:4px 0 14px;cursor:pointer}
.err{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;line-height:1.7}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(70px,1fr));gap:8px;margin:6px 0 16px}
.levels a{display:block;text-align:center;padding:10px 0;border-radius:10px;background:var(--card);border:1px solid var(--line);color:var(--ink);text-decoration:none;font:600 14px "Lexend",sans-serif}
footer{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
</style>
</head>
<body>
<main id="app"></main>
<script>
(function(){
  // 레벨별 트랙 수 (본사 Monthly Test zip 기준)
  var TRACKS = { phonics: 3, '240': 5, '520': 5, '860': 4, '1240': 4, '1680': 4 };
  var LABEL = { phonics: 'Phonics', '240': '240', '520': '520', '860': '860', '1240': '1240', '1680': '1680' };
  var app = document.getElementById('app');
  var q = new URLSearchParams(location.search);
  var lv = String(q.get('lv') || '').toLowerCase();
  var v = parseInt(q.get('v'), 10);

  function esc(s){ return String(s).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); }

  if (!TRACKS[lv] || !(v >= 1 && v <= 6)) {
    var links = '';
    Object.keys(TRACKS).forEach(function(k){
      links += '<h2 style="font:700 16px Lexend,sans-serif;margin:14px 0 6px">' + LABEL[k] + '</h2><div class="levels">';
      for (var i = 1; i <= 6; i++) links += '<a href="?lv=' + k + '&v=' + i + '">Vol.' + i + '</a>';
      links += '</div>';
    });
    app.innerHTML = '<header><div class="badge">고래</div><div><h1>먼슬리 테스트 듣기</h1><p class="sub">레벨과 권을 골라 주세요</p></div></header>' + links;
    return;
  }

  var n = TRACKS[lv];
  var title = LABEL[lv] + ' Vol.' + v;
  document.title = title + ' 먼슬리 듣기 · 고래영어';
  var html = '<header><div class="badge">' + esc(LABEL[lv] === 'Phonics' ? 'PH' : LABEL[lv]) + '</div><div><h1>' + esc(title) + ' Monthly Test</h1><p class="sub">듣기 음원 ' + n + '개</p></div></header>' +
    '<div class="tip">시험지의 <b>Track 번호</b>와 같은 음원을 눌러 들으세요. 한 번 더 들으려면 다시 누르면 됩니다.</div>' +
    '<button class="all" id="all">▶ 처음부터 차례로 듣기</button>';
  for (var i = 1; i <= n; i++) {
    var t = ('0' + i).slice(-2);
    html += '<div class="track" data-i="' + i + '"><button class="play" aria-label="Track ' + t + ' 재생">▶</button>' +
      '<div class="info"><div class="name"><span class="num">' + i + '</span>Track ' + t + '</div><div class="bar"><i></i></div><div class="time">0:00</div></div></div>';
  }
  html += '<footer>고래영어 진주 초전캠퍼스</footer>';
  app.innerHTML = html;

  var audio = new Audio();
  audio.preload = 'none';
  var cur = 0, chain = false;
  var rows = app.querySelectorAll('.track');

  function src(i){ return 'audio/' + lv + '-v' + v + '-t' + ('0' + i).slice(-2) + '.mp3'; }
  function fmt(s){ s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ':' + ('0' + (s % 60)).slice(-2); }
  function row(i){ return rows[i - 1]; }
  function setBtn(i, playing){ var r = row(i); if (r) r.querySelector('.play').textContent = playing ? '❚❚' : '▶'; }

  function play(i){
    if (cur && cur !== i) { setBtn(cur, false); row(cur).classList.remove('on'); }
    if (cur === i && !audio.paused) { audio.pause(); return; }
    if (cur !== i) { audio.src = src(i); cur = i; }
    row(i).classList.add('on');
    audio.play().catch(function(){});
  }

  rows.forEach(function(r){
    r.querySelector('.play').addEventListener('click', function(){ chain = false; play(+r.dataset.i); });
  });
  document.getElementById('all').addEventListener('click', function(){ chain = true; if (cur) { audio.currentTime = 0; } play(1); });

  audio.addEventListener('play', function(){ setBtn(cur, true); });
  audio.addEventListener('pause', function(){ setBtn(cur, false); });
  audio.addEventListener('timeupdate', function(){
    var r = row(cur); if (!r) return;
    r.querySelector('.bar i').style.width = (audio.duration ? audio.currentTime / audio.duration * 100 : 0) + '%';
    r.querySelector('.time').textContent = fmt(audio.currentTime) + (audio.duration ? ' / ' + fmt(audio.duration) : '');
  });
  audio.addEventListener('ended', function(){
    var r = row(cur); r.classList.remove('on'); r.classList.add('done'); setBtn(cur, false);
    if (chain && cur < n) play(cur + 1); else chain = false;
  });
  audio.addEventListener('error', function(){
    var r = row(cur); if (r) r.querySelector('.time').textContent = '음원을 불러오지 못했어요. 잠시 뒤 다시 눌러 주세요.';
  });
})();
</script>
</body>
</html>
