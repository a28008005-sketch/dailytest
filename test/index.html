<style>
/* 색은 인쇄물에서 그대로 뽑아 왔습니다. 종이와 화면이 같은 주황을 씁니다. */
:root {
  --paper: #FFF7EE;
  --card: #FFFFFF;
  --zebra: #FFEBD6;
  --ink: #16202B;
  --muted: #7A6A5C;
  --line: #EADBCB;
  --orange: #F07B0F;
  --orange-soft: #FDD9B4;
  --rust: #94480A;
  --done: #1E7A54;
  --on-accent: #FFFFFF;
  --shadow: 0 1px 2px rgba(22, 32, 43, .06), 0 8px 24px rgba(148, 72, 10, .07);
  --radius: 14px;
}
:root:not([data-theme="light"]) {
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #12181F;
    --card: #1B242E;
    --zebra: #26201A;
    --ink: #F2E9DF;
    --muted: #A2968A;
    --line: #33404C;
    --orange: #FF9A3D;
    --orange-soft: #4A3320;
    --rust: #FFC58A;
    --done: #55C79A;
    --on-accent: #12181F;
    --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #12181F;
  --card: #1B242E;
  --zebra: #26201A;
  --ink: #F2E9DF;
  --muted: #A2968A;
  --line: #33404C;
  --orange: #FF9A3D;
  --orange-soft: #4A3320;
  --rust: #FFC58A;
  --done: #55C79A;
  --on-accent: #12181F;
  --shadow: 0 1px 2px rgba(0, 0, 0, .4), 0 8px 24px rgba(0, 0, 0, .35);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "Gothic A1", "Malgun Gothic", system-ui, sans-serif;
  -webkit-text-size-adjust: 100%;
}
.wrap {
  max-width: 560px;
  margin: 0 auto;
  padding: 0 16px 120px;
  display: flex;
  flex-direction: column;
  gap: 18px;
}

/* ── 머리글: 인쇄물 상단 띠와 같은 모양 ─────────────────── */
.masthead {
  margin: 16px 0 0;
  background: var(--orange);
  border-radius: var(--radius);
  padding: 12px 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  color: var(--on-accent);
  box-shadow: var(--shadow);
}
.badge {
  background: color-mix(in srgb, var(--on-accent) 20%, transparent);
  border: 1px solid color-mix(in srgb, var(--on-accent) 45%, transparent);
  border-radius: 999px;
  padding: 3px 11px;
  font-weight: 700;
  font-size: 13px;
  letter-spacing: .02em;
  white-space: nowrap;
}
.mast-day {
  font-family: Fraunces, Georgia, serif;
  font-weight: 600;
  font-size: 17px;
  letter-spacing: .01em;
}
.mast-school {
  margin-left: auto;
  font-size: 11px;
  letter-spacing: .08em;
  opacity: .85;
  white-space: nowrap;
}

/* ── 10번 읽기 진행 ─────────────────────────────────── */
.tracker {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 16px 16px 18px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: var(--shadow);
}
.tracker-top {
  display: flex;
  align-items: baseline;
  gap: 8px;
}
.tracker-title {
  font-weight: 700;
  font-size: 15px;
}
.tracker-count {
  margin-left: auto;
  font-family: Fraunces, Georgia, serif;
  font-size: 15px;
  font-variant-numeric: tabular-nums;
  color: var(--muted);
}
.tracker-count b {
  font-size: 26px;
  color: var(--orange);
  font-weight: 800;
}
.pips {
  display: grid;
  grid-template-columns: repeat(10, 1fr);
  gap: 6px;
}
.pip {
  aspect-ratio: 1;
  border: 1.5px solid var(--line);
  border-radius: 9px;
  background: transparent;
  color: var(--muted);
  font-family: Fraunces, Georgia, serif;
  font-size: 13px;
  font-variant-numeric: tabular-nums;
  display: grid;
  place-items: center;
  padding: 0;
  cursor: pointer;
  transition: background .18s, color .18s, border-color .18s, transform .18s;
}
.pip:hover { border-color: var(--orange); }
.pip.on {
  background: var(--orange);
  border-color: var(--orange);
  color: var(--on-accent);
  font-weight: 800;
}
.pip:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
.tracker-note {
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.55;
}
.tracker.finished .tracker-note { color: var(--done); font-weight: 700; }

/* ── 큰 재생 단추 ───────────────────────────────────── */
.play-main {
  width: 100%;
  border: none;
  border-radius: 12px;
  background: var(--orange);
  color: var(--on-accent);
  font-family: inherit;
  font-weight: 700;
  font-size: 16px;
  padding: 15px 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  cursor: pointer;
  transition: filter .15s, transform .1s;
}
.play-main:hover { filter: brightness(1.05); }
.play-main:active { transform: translateY(1px); }
.play-main:focus-visible { outline: 2px solid var(--rust); outline-offset: 3px; }
.play-main svg { width: 18px; height: 18px; flex: none; }

/* ── 문장 목록 ─────────────────────────────────────── */
.list {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
  box-shadow: var(--shadow);
}
.row {
  display: grid;
  grid-template-columns: 30px 1fr;
  gap: 2px 10px;
  align-items: baseline;
  padding: 11px 14px 12px;
  border: none;
  border-top: 1px solid var(--line);
  width: 100%;
  background: transparent;
  text-align: left;
  font-family: inherit;
  color: inherit;
  cursor: pointer;
  transition: background .15s;
}
.row:first-child { border-top: none; }
.row.alt { background: var(--zebra); }
.row:hover { background: var(--orange-soft); }
.row:focus-visible { outline: 2px solid var(--orange); outline-offset: -2px; }
.row.speaking { background: var(--orange-soft); }
.row.speaking .row-en { color: var(--rust); }
.row-num {
  font-family: Fraunces, Georgia, serif;
  font-size: 12px;
  font-variant-numeric: tabular-nums;
  color: var(--orange);
  font-weight: 600;
  padding-top: 3px;
}
.row-en {
  font-family: Lexend, system-ui, sans-serif;
  font-weight: 500;
  font-size: 17.5px;
  line-height: 1.4;
  letter-spacing: -.005em;
}
.row-ko {
  grid-column: 2;
  font-size: 13px;
  color: var(--muted);
  line-height: 1.5;
}
.row.word .row-en { font-weight: 600; }

.section-label {
  padding: 9px 14px;
  background: var(--zebra);
  border-top: 1px solid var(--line);
  font-size: 11px;
  font-weight: 700;
  letter-spacing: .1em;
  color: var(--rust);
}
.list .section-label:first-child { border-top: none; }

/* ── 설정 ─────────────────────────────────────────── */
.tools {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  align-items: center;
  font-size: 13px;
  color: var(--muted);
}
.chip {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  border-radius: 999px;
  padding: 7px 13px;
  font-family: inherit;
  font-size: 13px;
  cursor: pointer;
  transition: border-color .15s, color .15s;
}
.chip:hover { border-color: var(--orange); }
.chip[aria-pressed="true"] {
  border-color: var(--orange);
  color: var(--rust);
  font-weight: 700;
}
.chip:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
select.chip { padding-right: 8px; max-width: 210px; }

.warn {
  background: var(--zebra);
  border: 1px solid var(--orange-soft);
  border-radius: 12px;
  padding: 12px 14px;
  font-size: 13px;
  line-height: 1.6;
  color: var(--rust);
}

.hint {
  font-size: 12.5px;
  color: var(--muted);
  line-height: 1.65;
  text-align: center;
}
.hint b { color: var(--rust); }

.daynav {
  display: flex;
  gap: 8px;
  justify-content: center;
}

/* ── Sentence Bank 말하기 카드로 가는 링크 ───────────── */
.cardlink {
  display: flex; align-items: center; gap: 12px;
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; box-shadow: var(--shadow); text-decoration: none; color: inherit;
}
.cardlink .cl-ic {
  width: 42px; height: 42px; border-radius: 12px; flex: none; display: grid; place-items: center;
  background: var(--orange); color: var(--on-accent, #fff);
}
.cardlink .cl-ic svg { width: 24px; height: 24px; }
.cardlink b { display: block; font-size: 15px; }
.cardlink small { display: block; font-size: 12.5px; color: var(--muted); margin-top: 2px; }
.cardlink[hidden] { display: none; }
.cardlink .cl-go { margin-left: auto; font-size: 20px; color: var(--muted); }

/* ── 주소에 일차가 없을 때 고르는 화면 ─────────────── */
.picker {
  background: var(--card);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: 18px 16px 20px;
  display: flex;
  flex-direction: column;
  gap: 14px;
  box-shadow: var(--shadow);
}
.picker h2 {
  margin: 0;
  font-family: Fraunces, Georgia, serif;
  font-size: 19px;
  font-weight: 600;
}
.picker p { margin: 0; font-size: 13px; color: var(--muted); line-height: 1.6; }
.picker-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.lvbtn {
  border: 1.5px solid var(--line);
  background: transparent;
  color: var(--ink);
  border-radius: 11px;
  padding: 11px 6px;
  font-family: Fraunces, Georgia, serif;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: border-color .15s, background .15s, color .15s;
}
.lvbtn:hover { border-color: var(--orange); }
.lvbtn[aria-pressed="true"] {
  background: var(--orange);
  border-color: var(--orange);
  color: var(--on-accent);
}
.lvbtn:focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
.picker select {
  width: 100%;
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  border-radius: 11px;
  padding: 12px 12px;
  font-family: inherit;
  font-size: 15px;
}
.picker select:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

/* ── 재생 중 아래 막대 ──────────────────────────────── */
.dock {
  position: fixed;
  left: 0; right: 0; bottom: 0;
  padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  background: color-mix(in srgb, var(--card) 92%, transparent);
  backdrop-filter: blur(10px);
  border-top: 1px solid var(--line);
  display: flex;
  justify-content: center;
  transform: translateY(110%);
  transition: transform .22s ease;
}
.dock.up { transform: none; }
.dock-inner {
  width: 100%;
  max-width: 528px;
  display: flex;
  align-items: center;
  gap: 10px;
}
.dock-now {
  flex: 1;
  min-width: 0;
  font-family: Lexend, system-ui, sans-serif;
  font-size: 14px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.dock-stop {
  border: 1px solid var(--line);
  background: var(--card);
  color: var(--ink);
  border-radius: 999px;
  padding: 8px 16px;
  font-family: inherit;
  font-size: 13px;
  font-weight: 700;
  cursor: pointer;
}
.dock-stop:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; animation: none !important; }
}
@media (max-width: 380px) {
  .row-en { font-size: 16.5px; }
  .mast-school { display: none; }
}

4 Day4","items":[["worship","숭배하다","word"],["history","역사","word"],["spa","스파, 온천","word"],["relax","편하게 하다, 쉬게 하다","word"],["condor","콘도르(주로 남미에 서식하는 대형 독수리)","word"],["They were worshipped long ago.","먼 옛날에 그것들은 숭배되었어요.","sent"],["It was built by the Incas.","그것은 잉카인들에 의해 지어졌어요.","sent"],["Where are coral reefs found?","산호초들은 어디서 발견되나요?","sent"],["They are found in the Pacific Ocean.","그것들은 태평양에서 발견돼요.","sent"],["We are invited to a birthday party.","우리는 생일 파티에 초대되었어요.","sent"]]},"lv1680-V6U4D5":{"L":"lv1680","label":"Vol.6 Unit4 Day5","items":[["grassland","풀밭, 초원","word"],["Portuguese","포르투갈어, 포르투갈 사람","word"],["the Pacific Ocean","태평양","word"],["steal","훔치다","word"],["key chain","열쇠고리","word"],["cause","~을 야기하다, ~을 초래하다","word"],["native","원주민, 현지인","word"],["contact","접촉, 연락","word"],["worship","숭배하다","word"],["history","역사","word"],["What language is spoken in Brazil?","브라질에서는 어떤 언어가 사용되나요?","sent"],["English is spoken in Australia.","호주에서는 영어가 사용돼요.","sent"],["Where are ostriches found?","타조들은 어디서 발견되나요?","sent"],["The tree was damaged by lightning last night.","그 나무는 어젯밤 번개에 의해 피해를 입었어요.","sent"],["The teddy bear was made by my mother.","그 곰인형은 나의 엄마에 의해 만들어졌어요.","sent"],["English is spoken in many countries.","영어는 많은 나라에서 사용돼요.","sent"],["Every year, Hawaii is visited by many tourists.","매년, 하와이는 많은 관광객들의 방문을 받아요.","sent"],["Cook was helped by the natives.","Cook은 원주민들의 도움을 받았어요.","sent"],["They were worshipped long ago.","먼 옛날에 그것들은 숭배되었어요.","sent"],["It was built by the Incas.","그것은 잉카인들에 의해 지어졌어요.","sent"]]}}}</script>
<script>
(function () {
  "use strict";

  var DB = JSON.parse(document.getElementById("dayData").textContent);
  // 학원 서버에 올릴 때만 채워집니다. 비어 있으면 휴대폰 음성으로 읽습니다.
  var AUDIO_BASE = "audio";

  var ids = Object.keys(DB.days);

  function readParam() {
    var q = new URLSearchParams(location.search).get("d");
    if (!q && location.hash) q = new URLSearchParams(location.hash.slice(1)).get("d");
    return q;
  }

  var $ = function (id) { return document.getElementById(id); };

  var dayId = readParam();

  // 주소에 일차가 없으면 고르는 화면을 띄웁니다.
  // Artifact 공유 링크는 주소 뒤의 값을 페이지 안까지 넘겨 주지 않으므로
  // 그쪽으로 들어온 사람은 항상 이 화면을 먼저 만납니다.
  if (!dayId || !DB.days[dayId]) {
    showPicker();
    return;
  }

  var day = DB.days[dayId];
  var level = DB.levels[day.L];
  document.documentElement.setAttribute("data-level", day.L);

  function showPicker() {
    document.querySelector(".wrap").hidden = true;
    $("dock").hidden = true;
    var wrap = $("pickerWrap");
    wrap.hidden = false;

    var lvIds = Object.keys(DB.levels);
    var pick = lvIds[0];
    try { pick = localStorage.getItem("whale-listen-level") || pick; } catch (e) {}
    if (lvIds.indexOf(pick) < 0) pick = lvIds[0];
    document.documentElement.setAttribute("data-level", pick);

    var grid = $("lvGrid");
    var sel = $("daySel");

    function fillDays() {
      sel.innerHTML = "";
      ids.forEach(function (id) {
        if (DB.days[id].L !== pick) return;
        var o = document.createElement("option");
        o.value = id;
        o.textContent = DB.days[id].label;
        sel.appendChild(o);
      });
    }

    lvIds.forEach(function (id) {
      var b = document.createElement("button");
      b.type = "button";
      b.className = "lvbtn";
      b.textContent = DB.levels[id].short;
      b.setAttribute("aria-pressed", id === pick ? "true" : "false");
      b.addEventListener("click", function () {
        pick = id;
        document.documentElement.setAttribute("data-level", id);
        try { localStorage.setItem("whale-listen-level", id); } catch (e) {}
        grid.querySelectorAll(".lvbtn").forEach(function (x) { x.setAttribute("aria-pressed", "false"); });
        b.setAttribute("aria-pressed", "true");
        fillDays();
      });
      grid.appendChild(b);
    });
    fillDays();

    $("openDay").addEventListener("click", function () {
      if (sel.value) location.search = "?d=" + encodeURIComponent(sel.value);
    });
  }

  // ── 화면 그리기 ──────────────────────────────────

  document.getElementById("badge").textContent = level.short;
  document.getElementById("mastDay").textContent = day.label.replace(/Vol\.(\d+) Unit(\d+) Day(\d+)/, "V$1 · Unit $2 · Day $3");
  document.title = level.short + " " + day.label + " 듣기";

  var listEl = $("list");
  var rows = [];
  var lastKind = null;
  day.items.forEach(function (it, i) {
    if (it[2] !== lastKind) {
      var lab = document.createElement("div");
      lab.className = "section-label";
      lab.textContent = it[2] === "sent" ? "문장" : "단어";
      listEl.appendChild(lab);
      lastKind = it[2];
    }
    var b = document.createElement("button");
    b.type = "button";
    b.className = "row" + (it[2] === "word" ? " word" : "") + (i % 2 ? " alt" : "");
    b.innerHTML =
      '<span class="row-num"></span><span class="row-en"></span><span class="row-ko"></span>';
    b.children[0].textContent = i + 1;
    b.children[1].textContent = it[0];
    b.children[2].textContent = it[1] || "";
    b.addEventListener("click", function () { speakOne(i); });
    listEl.appendChild(b);
    rows.push(b);
  });

  // ── 10번 읽기 기록 (이 기기에만 남습니다) ──────────
  var KEY = "whale-listen-sheet:" + dayId;
  function loadCount() {
    try { return Math.min(10, Math.max(0, parseInt(localStorage.getItem(KEY), 10) || 0)); }
    catch (e) { return 0; }
  }
  function saveCount(n) { try { localStorage.setItem(KEY, String(n)); } catch (e) {} }

  var count = loadCount();
  var pipsEl = $("pips");
  var pips = [];
  for (var p = 1; p <= 10; p++) {
    (function (n) {
      var el = document.createElement("button");
      el.type = "button";
      el.className = "pip";
      el.textContent = n;
      el.setAttribute("aria-label", n + "번째 읽기");
      el.addEventListener("click", function () { setCount(count === n ? n - 1 : n); });
      pipsEl.appendChild(el);
      pips.push(el);
    })(p);
  }
  function setCount(n) {
    count = Math.min(10, Math.max(0, n));
    saveCount(count);
    paintCount();
  }
  function paintCount() {
    $("readCount").textContent = count;
    for (var i = 0; i < 10; i++) pips[i].classList.toggle("on", i < count);
    var done = count >= 10;
    $("tracker").classList.toggle("finished", done);
    $("trackerNote").textContent = done
      ? "열 번 다 읽었습니다. 이제 녹음해서 선생님께 보내세요."
      : "한 번 다 듣고 따라 읽으면 칸이 하나 채워집니다.";
  }
  paintCount();
  $("resetBtn").addEventListener("click", function () { setCount(0); });

  // ── 원어민 음성 고르기 ────────────────────────────
  // 음성 목록은 늦게 도착합니다. 기다리지 않고 재생하면 한국어 음성이
  // 영어를 읽어 버리므로, 준비될 때까지 미룹니다.
  var synth = window.speechSynthesis;
  var voices = [];
  var chosen = null;
  var VOICE_KEY = "whale-listen-voice";

  function rank(v) {
    var n = (v.name || "") + " " + (v.voiceURI || "");
    var s = 0;
    if (/natural|neural/i.test(n)) s += 6;
    if (/enhanced|premium/i.test(n)) s += 5;
    if (/google/i.test(n)) s += 4;
    if (/samantha|aria|jenny|ava|siri/i.test(n)) s += 3;
    if (/en[-_]us/i.test(v.lang || "")) s += 2;
    else if (/en[-_]gb/i.test(v.lang || "")) s += 1;
    if (v.localService) s += 1;
    return s;
  }

  function pickVoices() {
    var all = synth ? synth.getVoices() : [];
    voices = all.filter(function (v) { return /^en(-|_|$)/i.test(v.lang || ""); });
    voices.sort(function (a, b) { return rank(b) - rank(a); });

    var sel = $("voiceSel");
    sel.innerHTML = "";
    if (!voices.length) {
      $("voiceWarn").hidden = false;
      $("voiceWarn").textContent =
        "이 기기에 영어 음성이 없습니다. 휴대폰 설정에서 영어 음성을 내려받으면 소리가 납니다.";
      sel.hidden = true;
      return;
    }
    $("voiceWarn").hidden = true;
    sel.hidden = false;

    var saved = null;
    try { saved = localStorage.getItem(VOICE_KEY); } catch (e) {}
    chosen = voices.filter(function (v) { return v.name === saved; })[0] || voices[0];

    voices.forEach(function (v) {
      var o = document.createElement("option");
      o.value = v.name;
      o.textContent = v.name.replace(/^Microsoft |Desktop$| Online \(Natural\)/g, "").trim() || v.name;
      if (v === chosen) o.selected = true;
      sel.appendChild(o);
    });
  }

  if (synth) {
    pickVoices();
    synth.addEventListener && synth.addEventListener("voiceschanged", pickVoices);
    if ("onvoiceschanged" in synth) synth.onvoiceschanged = pickVoices;
    // 사파리는 voiceschanged 를 안 쏘는 일이 있어 한 번 더 확인합니다.
    setTimeout(pickVoices, 900);
  } else {
    $("voiceWarn").hidden = false;
    $("voiceWarn").textContent = "이 브라우저는 소리 읽기를 지원하지 않습니다. 크롬이나 사파리로 열어 주세요.";
  }

  $("voiceSel").addEventListener("change", function (e) {
    chosen = voices.filter(function (v) { return v.name === e.target.value; })[0] || chosen;
    try { localStorage.setItem(VOICE_KEY, e.target.value); } catch (err) {}
    stop();
    speakText(chosen ? "Nice to meet you." : "");
  });

  // ── 속도 ────────────────────────────────────────
  var SPEEDS = [[0.75, "천천히"], [0.9, "보통 속도"], [1, "빠르게"]];
  var speedIx = 1;
  try {
    var sv = parseInt(localStorage.getItem("whale-listen-speed"), 10);
    if (sv >= 0 && sv < SPEEDS.length) speedIx = sv;
  } catch (e) {}
  function paintSpeed() {
    $("speedBtn").textContent = SPEEDS[speedIx][1];
    $("speedBtn").setAttribute("aria-pressed", speedIx !== 1 ? "true" : "false");
  }
  paintSpeed();
  $("speedBtn").addEventListener("click", function () {
    speedIx = (speedIx + 1) % SPEEDS.length;
    try { localStorage.setItem("whale-listen-speed", String(speedIx)); } catch (e) {}
    paintSpeed();
  });

  // ── 재생 ────────────────────────────────────────
  var playing = false;   // 전체 듣기가 도는 중인지
  var cursor = -1;
  var soloIx = -1;       // 한 줄만 눌러 듣는 중인 줄
  var audio = null;      // 학원 서버에 음원이 있을 때만 씁니다

  function markRow(i) {
    rows.forEach(function (r, k) { r.classList.toggle("speaking", k === i); });
    if (i >= 0) {
      $("dockNow").textContent = day.items[i][0];
      rows[i].scrollIntoView({ block: "center", behavior: "smooth" });
    }
  }
  function dock(up) { $("dock").classList.toggle("up", up); }

  function speakText(text, onEnd) {
    if (!synth || !text) { if (onEnd) onEnd(); return; }
    var u = new SpeechSynthesisUtterance(text);
    if (chosen) { u.voice = chosen; u.lang = chosen.lang; } else { u.lang = "en-US"; }
    u.rate = SPEEDS[speedIx][0];
    u.pitch = 1;
    if (onEnd) { u.onend = onEnd; u.onerror = onEnd; }
    synth.speak(u);
  }

  function stop() {
    playing = false;
    cursor = -1;
    soloIx = -1;
    if (synth) synth.cancel();
    if (audio) { audio.pause(); audio = null; }
    markRow(-1);
    dock(false);
    $("playAllLabel").textContent = "전체 듣기";
  }

  function speakOne(i) {
    // 읽고 있던 줄을 다시 누르면 멈춥니다.
    var again = !playing && soloIx === i;
    stop();
    if (again) return;
    soloIx = i;
    markRow(i);
    dock(true);
    speakText(day.items[i][0], function () {
      if (soloIx !== i) return;
      soloIx = -1;
      markRow(-1);
      dock(false);
    });
  }

  function step() {
    if (!playing) return;
    cursor++;
    if (cursor >= day.items.length) {
      var was = count;
      stop();
      if (was < 10) setCount(was + 1);
      return;
    }
    markRow(cursor);
    speakText(day.items[cursor][0], function () {
      // 단어와 문장 사이에 숨 쉴 틈을 둡니다.
      setTimeout(step, 420);
    });
  }

  function playAll() {
    if (playing) { stop(); return; }
    if (AUDIO_BASE) { playFile(); return; }
    playing = true;
    cursor = -1;
    dock(true);
    $("playAllLabel").textContent = "그만 듣기";
    step();
  }

  // 학원 서버에 하루치 mp3 를 올려 두었으면 그것을 씁니다.
  // Artifact 안에서는 바깥 파일을 못 불러오므로 조용히 휴대폰 음성으로 돌아갑니다.
  function playFile() {
    audio = new Audio(AUDIO_BASE.replace(/\/$/, "") + "/" + dayId + ".mp3");
    audio.playbackRate = SPEEDS[speedIx][0];
    playing = true;
    dock(true);
    $("playAllLabel").textContent = "그만 듣기";
    $("dockNow").textContent = day.label;
    audio.addEventListener("ended", function () {
      var was = count;
      stop();
      if (was < 10) setCount(was + 1);
    });
    audio.addEventListener("error", function () {
      audio = null;
      playing = true;
      cursor = -1;
      step();
    });
    audio.play().catch(function () {
      audio = null;
      playing = true;
      cursor = -1;
      step();
    });
  }

  $("playAll").addEventListener("click", playAll);
  $("dockStop").addEventListener("click", stop);
  window.addEventListener("pagehide", stop);

  // ── 앞뒤 Day ────────────────────────────────────
  var here = ids.indexOf(dayId);
  function go(delta) {
    var t = ids[here + delta];
    if (!t) return;
    location.search = "?d=" + encodeURIComponent(t);
  }
  // 이 Day 가 속한 단원의 말하기 카드로 바로 엽니다(파닉스는 카드가 없음).
  var um = /^lv(\d+)-V(\d)U(\d)D\d+$/.exec(dayId);
  if (um) {
    var cl = $("cardLink");
    cl.href += "?lv=" + um[1] + "&v=" + um[2] + "&u=" + um[3];
    cl.querySelector("small").textContent = "Vol." + um[2] + " Unit " + um[3] + " 카드로 사진 보고 말하기 연습";
    cl.hidden = false;
  }
  $("prevDay").disabled = here <= 0;
  $("nextDay").disabled = here >= ids.length - 1;
  $("prevDay").addEventListener("click", function () { go(-1); });
  $("nextDay").addEventListener("click", function () { go(1); });
})();
</script>

</body>
</html>
